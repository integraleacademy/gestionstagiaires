  <title id="title">Accès et parkings d’Intégrale Academy à Puget-sur-Argens</title>
  <desc id="desc">Schéma de la zone du Carréou. Le centre se situe près du rond-point, à côté du P4 réservé aux formateurs et aux PMR. Le P3 public longe le boulevard. Le P1 principal se trouve derrière La Poissonnerie et le P2 secondaire du côté du chemin du Moulin.</desc>
