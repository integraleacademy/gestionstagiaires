<!doctype html>
<html lang="fr">
<head>
  <meta name="integrale-maintenance-page" content="1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#344259">
  <title>Intégrale Connect · Connexion interrompue</title>
  <style>
    :root { color-scheme: light; --paper: #fbfaf6; --ink: #102540; --muted: #465466; --gold: #e6ac3b; font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--paper); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .mast { background: linear-gradient(90deg,#40506a,#344259 48%,#2b384d); color: #fff; border-bottom: 1px solid #ffffff26; font-family: ui-sans-serif,system-ui,sans-serif; }
    .mast-inner { --logo-height: 44px; max-width: 1440px; padding: 6px clamp(16px,3.2vw,56px); margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .identity { display: inline-flex; align-items: center; gap: 8px; }
    .identity img { display: block; height: var(--logo-height); width: auto; }
    .wordmark { white-space: nowrap; color: white; font-size: 11px; font-weight: 900; line-height: 1.5; letter-spacing: .06em; }
    .wordmark span { color: #e6b03a; }
    .product { color: #fffc; font-weight: 650; font-size: clamp(.76rem,1.15vw,.95rem); white-space: nowrap; }
    @media (min-width: 640px) {
      .mast-inner { --logo-height: 50px; }
      .identity { gap: 12px; } .wordmark { font-size: 15px; letter-spacing: .08em; }
    }
    @media (min-width: 1280px) {
      .mast-inner { --logo-height: 60.8px; } .wordmark { font-size: 19px; }
    }
    body { display: flex; flex-direction: column; min-height: 100svh; }
    .stage { flex: 1; position: relative; isolation: isolate; display: grid; align-items: center; min-height: 555px; overflow: hidden; }
    .scene { position: absolute; z-index: -1; inset: 0 0 0 52%; margin: 0; overflow: hidden; pointer-events: none; border-top-left-radius: 6% 90%; }
    .scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 48%; }
    .content-wrap { margin: auto; width: 100%; max-width: 1760px; padding: 72px clamp(24px,6.3vw,112px) 88px; }
    .content { width: min(46vw, 690px); }
    .state { display: flex; align-items: center; gap: 10px; font-size: .74rem; line-height: 1.5; font-weight: 750; letter-spacing: .105em; text-transform: uppercase; color: #3c4e60; }
    .signal { width: 9px; height: 9px; border-radius: 50%; background: #bb8222; box-shadow: 0 0 0 4px #f6ead2; margin-inline: 4px; }
    h1 { margin: 23px 0 22px; font-size: clamp(38px,4.4vw,70px); font-weight: 750; line-height: 1.035; letter-spacing: -.052em; text-wrap: balance; }
    .line { display: block; }
    .accent { position: relative; display: inline-block; white-space: nowrap; }
    .accent::after { content: ''; display: block; position: absolute; z-index: -1; height: .085em; bottom: .045em; left: .015em; right: -.025em; background: #f3c868; transform: rotate(-1.4deg); border-radius: 40% 16% 40% 14%; }
    .explanation { max-width: 44ch; text-wrap: balance; margin: 0; color: var(--muted); font-size: clamp(1rem,1.24vw,1.23rem); line-height: 1.62; }
    @media (min-width: 761px) and (max-width: 1050px) {
      .content-wrap { padding-inline: 4.7vw; }
      .scene { left: 52%; } .content { width: 48vw; } .explanation { max-width: 31ch; }
    }
    @media (max-width: 760px) {
      .stage { min-height: auto; align-content: start; display: flex; flex-direction: column; align-items: stretch; }
      .content-wrap { order: 0; padding: clamp(32px,6vh,64px) 7vw 6px; margin: 0; }
      .content { width: 100%; max-width: 560px; } .state { font-size: .65rem; }
      h1 { font-size: clamp(31px, 8.65vw, 54px); margin: 15px 0; }
      .explanation { font-size: 1rem; line-height: 1.55; max-width: 38ch; }
      .scene { order: 1; position: relative; inset: auto; flex: 1 0 auto; min-height: clamp(240px,76vw,470px); margin-top: 18px; border-radius: 0; }
      .scene img { position: absolute; inset: 0; object-position: center 45%; }
    }
    @media (max-width: 380px) {
      .mast-inner { --logo-height: 34px; padding-inline: 10px; gap: 6px; }
      .identity { gap: 5px; } .wordmark { font-size: 10px; letter-spacing: .045em; }
      .product { font-size: 11px; }
    }
    @media (max-width: 350px) { .content-wrap { padding-inline: 6vw; } h1 { font-size: 8.95vw; } }

    .waiting-status {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      max-width: 44ch;
    }
    .waiting-spinner {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border: 3px solid #e4dfd3;
      border-top-color: #ad761d;
      border-radius: 50%;
      animation: waiting-spin 1s linear infinite;
    }
    .waiting-title {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.5;
    }
    .waiting-detail {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5;
    }
    .retry-button {
      margin-top: 22px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .retry-button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    @keyframes waiting-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .waiting-spinner { animation: none; }
    }
  </style>
</head>

  <script>
    const original = new URL(location.href);
    const isPlatform = ['gestionstagiaires-r5no.onrender.com', 'integraleconnect.com', 'www.integraleconnect.com'].includes(original.hostname);
    if (isPlatform) {
      const interval = 12000;
      const maxInterval = 30000;
      const recoveryKey = 'integrale-maintenance-return';
      const note = document.getElementById('resume-note');
      const title = document.getElementById('waiting-title');
      const retryButton = document.getElementById('retry-page');
      let nextInterval = interval;
      let canReturnAutomatically = false;
      try {
        const previousReturn = Number(sessionStorage.getItem(recoveryKey));
        // A successful application page clears this marker. If we land here
        // again, stop automatic navigation instead of repeatedly losing focus.
        canReturnAutomatically = !previousReturn || Date.now() - previousReturn > 120000;
        // Detect storage restrictions before attempting an automatic return.
        sessionStorage.setItem(recoveryKey, String(previousReturn || 0));
      } catch (_) {
        // Without a per-tab guard, only a deliberate manual return is safe.
        canReturnAutomatically = false;
      }
      note.hidden = false;

      function pauseAutomaticReturn() {
        canReturnAutomatically = false;
        title.textContent = 'Le retour automatique est en pause.';
        note.textContent = 'La connexion reste instable. Vous pouvez réessayer dans quelques instants.';
        document.querySelector('.waiting-spinner').hidden = true;
        retryButton.hidden = false;
      }

      function reopenPage(automatic) {
        if (automatic && !canReturnAutomatically) return;
        try {
          sessionStorage.setItem(recoveryKey, String(Date.now()));
        } catch (_) {
          if (automatic) { pauseAutomaticReturn(); return; }
        }
        if (original.hash) {
          // Force a new GET even when the visitor was reading an anchored section.
          const temporary = new URL(original);
          temporary.searchParams.append('_maintenance', '1');
          history.replaceState(null, '', temporary.href);
        }
        location.replace(original.href);
      }
      retryButton.addEventListener('click', () => reopenPage(false));

      async function pageIsAvailable() {
        const controller = new AbortController();
        const deadline = setTimeout(() => controller.abort(), 10000);
        try {
          // Liveness alone says nothing about this particular page. Fetch its
          // complete HTML with the current login, without caching private data.
          const response = await fetch(original.href, {
            cache: 'no-store', credentials: 'same-origin', mode: 'same-origin',
            redirect: 'follow', headers: { Accept: 'text/html' }, signal: controller.signal,
          });
          if (!response.ok || !response.headers.get('Content-Type')?.includes('text/html')) return false;
          const html = await response.text();
          return /<\/body\s*>/i.test(html) && !html.includes('integrale-maintenance-page');
        } catch (_) {
          return false;
        } finally {
          clearTimeout(deadline);
        }
      }

      async function checkAvailability() {
        if (!canReturnAutomatically) return;
        let alive = false;
        if (navigator.onLine !== false) {
          const controller = new AbortController();
          const deadline = setTimeout(() => controller.abort(), 5000);
          try {
            const response = await fetch('/healthz', {
              cache: 'no-store', credentials: 'omit', redirect: 'error', signal: controller.signal,
            });
            alive = response.ok;
          } catch (_) {
            // Keep the fallback on screen during a temporary interruption.
          } finally {
            clearTimeout(deadline);
          }
          if (alive && await pageIsAvailable()) { reopenPage(true); return; }
        }
        setTimeout(checkAvailability, nextInterval);
        nextInterval = Math.min(maxInterval, nextInterval * 2);
      }
      if (canReturnAutomatically) setTimeout(checkAvailability, interval);
      else pauseAutomaticReturn();
    }
  </script>
