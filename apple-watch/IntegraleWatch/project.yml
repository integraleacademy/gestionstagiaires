name: IntegraleWatch

options:
  bundleIdPrefix: com.integraleacademy
  deploymentTarget:
    watchOS: "10.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  IntegraleWatch Container:
    type: application.watchapp2-container
    platform: watchOS
    info:
      path: Container/Info.plist
      properties:
        CFBundleDisplayName: Intégrale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integraleacademy.IntegraleWatch
        PRODUCT_NAME: Intégrale
    dependencies:
      - target: IntegraleWatch Watch App

  IntegraleWatch Watch App:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: WatchAppResources/Assets.xcassets
    info:
      path: WatchAppResources/Info.plist
      properties:
        CFBundleDisplayName: Intégrale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKWatchKitApp: true
        CFBundleURLTypes:
          - CFBundleURLName: com.integraleacademy.IntegraleWatch
            CFBundleURLSchemes:
              - integralewatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integraleacademy.IntegraleWatch.watchkitapp
        PRODUCT_NAME: Intégrale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: IntegraleWatch Extension
      - target: IntegraleWatchWidget
        embed: true

  IntegraleWatch Extension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: IntegraleWatchExtension
    info:
      path: IntegraleWatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Intégrale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IntegraleWatchKeychainAccessGroup: $(AppIdentifierPrefix)com.integraleacademy.IntegraleWatch.shared
        WKWatchOnly: true
        WKRunsIndependentlyOfCompanionApp: true
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.integraleacademy.IntegraleWatch.watchkitapp
          NSExtensionPointIdentifier: com.apple.watchkit
    entitlements:
      path: IntegraleWatchExtension/IntegraleWatchExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integraleacademy.IntegraleWatch.watchkitapp.watchkitextension
        PRODUCT_NAME: Intégrale
        APPLICATION_EXTENSION_API_ONLY: true

  IntegraleWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: IntegraleWatchWidget
    info:
      path: IntegraleWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: KPI Intégrale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IntegraleWatchKeychainAccessGroup: $(AppIdentifierPrefix)com.integraleacademy.IntegraleWatch.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IntegraleWatchWidget/IntegraleWatchWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integraleacademy.IntegraleWatch.watchkitapp.widget
        PRODUCT_NAME: KPI Intégrale
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true

schemes:
  IntegraleWatch:
    build:
      targets:
        IntegraleWatch Container: all
    run:
      config: Debug
    archive:
      config: Release
