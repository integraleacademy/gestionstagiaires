<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fbfaf6">
  <title>De retour dans quelques instants · Intégrale Academy</title>
  <style>
    :root { color-scheme: light; --paper: #fbfaf6; --ink: #102540; --muted: #465466; --gold: #e6ac3b; font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--paper); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .mast { position: relative; z-index: 1; background: #fff; border-bottom: 1px solid #dfe4e5; }
    .mast-inner { max-width: 1760px; height: clamp(72px, 8.8vh, 92px); padding-inline: clamp(24px, 6.3vw, 112px); margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .identity { display: flex; align-items: center; gap: 11px; }
    .identity img { height: 45px; width: 45px; border-radius: 50%; }
    .wordmark { display: grid; text-transform: uppercase; font-size: 15px; font-weight: 800; line-height: 1.04; letter-spacing: .005em; color: #17202a; }
    .wordmark span { color: #90600c; font-size: 12px; letter-spacing: .15em; margin-top: 2px; }
    .product { color: #39495d; font-weight: 600; font-size: .88rem; display: flex; align-items: center; gap: 9px; }
    .product svg { color: #506582; }
    .stage { position: relative; isolation: isolate; display: grid; align-items: center; min-height: max(585px,calc(100svh - clamp(72px,8.8vh,92px))); overflow: hidden; }
    .scene { position: absolute; z-index: -1; inset: 0 0 0 29%; margin: 0; pointer-events: none; -webkit-mask-image: linear-gradient(90deg,transparent 0%,#0000 9%,#0002 25%,#000c 40%,#000 50%); mask-image: linear-gradient(90deg,transparent 0%,#0000 9%,#0002 25%,#000c 40%,#000 50%); }
    .scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 69% center; }
    .content-wrap { margin: auto; width: 100%; max-width: 1760px; padding: 72px clamp(24px,6.3vw,112px) 88px; }
    .content { width: min(46vw, 690px); }
    .state { display: flex; align-items: center; gap: 10px; font-size: .74rem; line-height: 1.5; font-weight: 750; letter-spacing: .105em; text-transform: uppercase; color: #3c4e60; }
    .signal { width: 9px; height: 9px; border-radius: 50%; background: #bb8222; box-shadow: 0 0 0 4px #f6ead2; margin-inline: 4px; }
    h1 { margin: 23px 0 22px; font-size: clamp(38px,4.4vw,70px); font-weight: 750; line-height: 1.035; letter-spacing: -.052em; text-wrap: balance; }
    .line { display: block; }
    .accent { position: relative; display: inline-block; white-space: nowrap; }
    .accent::after { content: ''; display: block; position: absolute; z-index: -1; height: .085em; bottom: .045em; left: .015em; right: -.025em; background: #f3c868; transform: rotate(-1.4deg); border-radius: 40% 16% 40% 14%; }
    .explanation { max-width: 34ch; margin: 0; color: var(--muted); font-size: clamp(1rem,1.24vw,1.23rem); line-height: 1.62; }
    .actions { margin-top: 32px; }
    .retry { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 22px; min-height: 49px; border-radius: 9px; background: var(--ink); color: white; text-decoration: none; font-size: .94rem; font-weight: 650; box-shadow: 0 3px 0 #0a1b3012; }
    .retry:hover { background: #224164; }
    .retry:focus-visible { outline: 3px solid #a77214; outline-offset: 4px; }
    .retry[aria-disabled="true"] { cursor: wait; }
    .feedback { margin: 10px 0 0; min-height: 1.4em; color: var(--muted); font-size: .85rem; }
    .feedback:empty { visibility: hidden; }
    @media (min-width: 761px) and (max-width: 1050px) {
      .mast-inner, .content-wrap { padding-inline: 4.7vw; }
      .scene { left: 36%; } .content { width: 48vw; } .explanation { max-width: 31ch; }
    }
    @media (max-width: 760px) {
      .mast-inner { height: 67px; padding-inline: 6vw; }
      .identity { gap: 8px; } .identity img { width: 37px; height: 37px; } .wordmark { font-size: 12px; } .wordmark span { font-size: 10px; }
      .product { font-size: .78rem; gap: 6px; } .product svg { width: 15px; }
      .stage { min-height: calc(100svh - 67px); align-content: start; display: flex; flex-direction: column; align-items: stretch; }
      .content-wrap { order: 0; padding: clamp(32px,6vh,64px) 7vw 6px; margin: 0; }
      .content { width: 100%; max-width: 560px; } .state { font-size: .65rem; }
      h1 { font-size: clamp(31px, 8.65vw, 54px); margin: 15px 0; }
      .explanation { font-size: 1rem; line-height: 1.55; max-width: 38ch; }
      .actions { margin-top: 21px; } .retry { min-height: 46px; padding: 0 18px; font-size: .9rem; }
      .feedback { min-height: 0; margin: 0; } .feedback:not(:empty) { margin-top: 9px; }
      .scene { order: 1; position: relative; inset: auto; flex: 1 0 auto; min-height: clamp(230px, 72vw, 410px); margin-top: 8px; -webkit-mask-image: linear-gradient(180deg,transparent,#000 16%); mask-image: linear-gradient(180deg,transparent,#000 16%); }
      .scene img { position: absolute; inset: 0; object-position: 73% 48%; }
    }
    @media (max-width: 350px) { .product svg { display: none; } .content-wrap { padding-inline: 6vw; } h1 { font-size: 8.95vw; } }
  </style>
</head>

  <script>
    const original = new URL(location.href);
    const isPlatform = ['gestionstagiaires-r5no.onrender.com', 'integraleconnect.com', 'www.integraleconnect.com'].includes(original.hostname);
    if (isPlatform) {
      const link = document.getElementById('retry');
      const feedback = document.getElementById('feedback');
      const label = document.getElementById('label');
      const interval = 12000;
      let inFlight = false;
      let timer;
      link.href = original.href;
      label.textContent = 'Réessayer maintenant';
      document.getElementById('message').textContent = 'Nous mettons à jour Gestion Stagiaires. Votre page se rouvrira automatiquement dès que votre espace sera disponible.';
      function reopenPage() {
        if (original.hash) {
          // Force a new GET even when the visitor was reading an anchored section.
          const temporary = new URL(original);
          temporary.searchParams.append('_maintenance', '1');
          history.replaceState(null, '', temporary.href);
        }
        location.replace(original.href);
      }
      async function checkAvailability(manual = false) {
        if (inFlight) return;
        inFlight = true;
        clearTimeout(timer);
        const controller = new AbortController();
        const deadline = setTimeout(() => controller.abort(), 5000);
        if (manual) {
          label.textContent = 'Vérification en cours…';
          link.setAttribute('aria-disabled', 'true');
          feedback.textContent = '';
        }
        let available = false;
        try {
          const response = await fetch('/healthz', {cache:'no-store', credentials:'omit', redirect:'error', signal:controller.signal});
          available = response.ok;
        } catch {
          // Expected while the application is restarting.
        } finally { clearTimeout(deadline); }
        if (available) { reopenPage(); return; }
        inFlight = false;
        if (manual) {
          label.textContent = 'Réessayer maintenant';
          link.removeAttribute('aria-disabled');
          feedback.textContent = 'La mise à jour est toujours en cours.';
        }
        timer = setTimeout(checkAvailability, interval);
      }
      link.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        checkAvailability(true);
      });
      timer = setTimeout(checkAvailability, interval);
    }
  </script>
