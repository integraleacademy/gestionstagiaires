  <script>
    const link = document.getElementById('retry');
    const isPlatform = ['gestionstagiaires-r5no.onrender.com', 'integraleconnect.com', 'www.integraleconnect.com'].includes(location.hostname);
    if (isPlatform) {
      // An ordinary link opens the original address with GET, even after a form submission.
      link.href = location.href;
      document.getElementById('message').textContent = 'Une mise à jour est en cours. Cette page se rouvrira automatiquement dès que la plateforme sera disponible.';
      function reopenPage() {
        const original = new URL(location.href);
        if (original.hash) {
          // Vary the current history entry first. Otherwise an anchor-only navigation
          // can keep the maintenance document on screen without sending a fresh GET.
          const temporary = new URL(original);
          temporary.searchParams.append('_maintenance', '1');
          history.replaceState(null, '', temporary.href);
        }
        location.replace(original.href);
      }
      link.addEventListener('click', event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        reopenPage();
      });
      async function checkAvailability() {
        const controller = new AbortController();
        const deadline = setTimeout(() => controller.abort(), 5000);
        try {
          const response = await fetch('/healthz', {cache:'no-store', credentials:'omit', redirect:'error', signal:controller.signal});
          if (response.ok) {
            reopenPage();
            return;
          }
        } catch {
          // A network failure is expected while the service is starting.
        } finally {
          clearTimeout(deadline);
        }
        setTimeout(checkAvailability, 12000);
      }
      setTimeout(checkAvailability, 12000);
    } else {
      link.firstChild.textContent = 'Ouvrir Gestion Stagiaires ';
    }
  </script>
