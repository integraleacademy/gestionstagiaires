 <path d="M38 656H97" class="link"/>
 <text x="113" y="662" class="small">Liaison prévue au plan. Ce trait ne garantit pas qu’elle est libre maintenant.</text>
 <text x="38" y="693" class="note">Lisez les messages de 17 h 03 et 17 h 05 pour déterminer l’état actuel et la consigne validée.</text>
 <text x="38" y="719" class="note">Aucune liaison publique vers A1 ou D3. Ne déduisez pas un raccourci de la proximité des cases.</text>
