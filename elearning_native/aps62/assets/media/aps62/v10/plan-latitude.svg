  <rect x="115" y="317" width="180" height="104" rx="12" fill="#e7efff" stroke="#2860e8" stroke-width="3"/>
  <text x="130" y="343" class="node">A2 · VOUS ÊTES ICI</text><text x="130" y="371" class="label">Hall public</text><text x="130" y="396" class="small">Votre poste</text>
  <rect x="362" y="317" width="175" height="104" rx="12" class="box"/>
  <text x="377" y="343" class="node">B2</text><text x="377" y="374" class="label">Porte Est</text>
  <rect x="609" y="317" width="175" height="104" rx="12" class="box"/>
  <text x="624" y="343" class="node">C2</text><text x="624" y="371" class="label">Passage E</text><text x="624" y="396" class="small">Couvert</text>
  <rect x="856" y="317" width="180" height="104" rx="12" class="box"/>
  <text x="871" y="343" class="node">D2</text><text x="871" y="371" class="label">Accueil Jardin</text><text x="871" y="396" class="small">Accessible</text>
  <rect x="115" y="485" width="180" height="104" rx="12" class="box"/>
