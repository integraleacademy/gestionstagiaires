<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
 <title id="title">Forum Latitude — plan pédagogique P8</title>
 <desc id="desc">Plan fictif et non à l'échelle. Le hall A2 rejoint la Porte Est B2, le passage couvert E C2 et le point d'accueil Jardin D2. Une autre liaison mène du hall à la Porte Sud A3 puis la rampe Sud B3. L'atelier A1 et l'accès secours D3 ne sont pas des cheminements publics. Vérifier l'état actuel des passages dans les pièces horodatées.</desc>
 <defs>
  <style>text{font-family:Arial,sans-serif;fill:#172b4d}.coord{font-size:17px;font-weight:700;fill:#586982}.label{font-size:20px;font-weight:700}.small{font-size:17px}.note{font-size:16px}.link{stroke:#456d9f;stroke-width:9;fill:none;stroke-linecap:round}.box{fill:#fff;stroke:#90a5be;stroke-width:2}.node{font-size:16px;font-weight:700;fill:#2454a9}</style>
 </defs>
 <rect width="1120" height="740" rx="16" fill="#f4f7fc"/>
 <rect width="1120" height="9" fill="#2860e8"/>
 <text x="34" y="48" font-size="27" font-weight="700">Forum Latitude · Plan P8</text>
 <text x="34" y="77" class="small">Dossier fictif · Schéma non à l’échelle · Les lettres et chiffres localisent les points.</text>
