<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">NRBC-E et cyber : familles de dangers et alerte</title><desc id="desc">Définitions des cinq familles, vérification indépendante des messages et informations utiles à la protection et à l’alerte.</desc><rect width="1200" height="100%" fill="#f2f6fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="42" y="58" font-size="31" fill="#17304d" font-weight="700">NRBC-E et cyber : reconnaître les limites de l’observation</text><text x="42" y="100" font-size="21" fill="#30445c" font-weight="400">Un danger décrit ne prouve ni une intention malveillante ni l’identité d’une substance.</text><text x="42" y="129" font-size="21" fill="#30445c" font-weight="400">La protection dépend de la situation et des instructions des intervenants compétents.</text><rect x="40" y="160" width="627" height="86" rx="18" fill="#fff" stroke="#d7e2ef"/><circle cx="83" cy="203" r="26" fill="#2657a0"/><text x="72" y="212" font-size="29" fill="#fff" font-weight="700">N</text><text x="124" y="193" font-size="23" fill="#17304d" font-weight="700">Nucléaire</text><text x="124" y="223" font-size="18" fill="#17304d" font-weight="400">Effets d’un événement nucléaire.</text><rect x="40" y="261" width="627" height="86" rx="18" fill="#fff" stroke="#d7e2ef"/><circle cx="83" cy="304" r="26" fill="#2657a0"/><text x="72" y="313" font-size="29" fill="#fff" font-weight="700">R</text><text x="124" y="294" font-size="23" fill="#17304d" font-weight="700">Radiologique</text><text x="124" y="324" font-size="18" fill="#17304d" font-weight="400">Rayonnements ou matières radioactives.</text><rect x="40" y="362" width="627" height="86" rx="18" fill="#fff" stroke="#d7e2ef"/><circle cx="83" cy="405" r="26" fill="#2657a0"/><text x="72" y="414" font-size="29" fill="#fff" font-weight="700">B</text><text x="124" y="395" font-size="23" fill="#17304d" font-weight="700">Biologique</text><text x="124" y="425" font-size="18" fill="#17304d" font-weight="400">Agents pouvant provoquer une maladie.</text><rect x="40" y="463" width="627" height="86" rx="18" fill="#fff" stroke="#d7e2ef"/><circle cx="83" cy="506" r="26" fill="#2657a0"/><text x="72" y="515" font-size="29" fill="#fff" font-weight="700">C</text><text x="124" y="496" font-size="23" fill="#17304d" font-weight="700">Chimique</text><text x="124" y="526" font-size="18" fill="#17304d" font-weight="400">Substances toxiques.</text><rect x="40" y="564" width="627" height="86" rx="18" fill="#fff" stroke="#d7e2ef"/><circle cx="83" cy="607" r="26" fill="#2657a0"/><text x="72" y="616" font-size="29" fill="#fff" font-weight="700">E</text><text x="124" y="597" font-size="23" fill="#17304d" font-weight="700">Explosif</text><text x="124" y="627" font-size="18" fill="#17304d" font-weight="400">Souffle, projections et effets associés.</text><rect x="689" y="160" width="470" height="490" rx="18" fill="#e9f1fc" stroke="#bdd2ed"/><text x="715" y="202" font-size="26" fill="#17304d" font-weight="700">Cyber : vérifier avant d’agir</text><text x="715" y="249" font-size="20" fill="#30445c" font-weight="400">Une demande paraît officielle ?</text><text x="715" y="282" font-size="20" fill="#30445c" font-weight="400">Le logo ne prouve pas son origine.</text><text x="715" y="315" font-size="20" fill="#30445c" font-weight="400"></text><text x="715" y="348" font-size="20" fill="#30445c" font-weight="400">Ne pas ouvrir le lien suspect.</text><text x="715" y="381" font-size="20" fill="#30445c" font-weight="400">Ne pas transmettre de secret.</text><text x="715" y="414" font-size="20" fill="#30445c" font-weight="400">Vérifier par un contact déjà connu.</text><text x="715" y="447" font-size="20" fill="#30445c" font-weight="400">Alerter le circuit de l’organisme.</text><text x="715" y="480" font-size="20" fill="#30445c" font-weight="400"></text><text x="715" y="513" font-size="20" fill="#30445c" font-weight="400">Une panne ne prouve pas une attaque.</text><text x="715" y="546" font-size="20" fill="#30445c" font-weight="400">Appliquer le mode dégradé validé.</text><rect x="40" y="680" width="1120" height="196" rx="18" fill="#fff" stroke="#bdd2ed"/><text x="65" y="721" font-size="25" fill="#17304d" font-weight="700">Ce qui aide le relais</text><text x="65" y="760" font-size="21" fill="#30445c" font-weight="400">Où et quand ?  Quels signes ?  Qui les a observés ?  Qui est exposé ?  Que reste-t-il inconnu ?</text><text x="65" y="797" font-size="21" fill="#30445c" font-weight="400">Protéger depuis une zone sûre ; ne pas toucher, prélever, sentir ou transporter une matière.</text><text x="65" y="834" font-size="21" fill="#30445c" font-weight="400">Pas de nettoyage ou de décontamination improvisés. Suivre les instructions adaptées.</text><text x="42" y="916" font-size="17" fill="#516780" font-weight="400">APS · Théorie de la prévention du terrorisme · Édition du 12 octobre 2026</text></g></svg>
