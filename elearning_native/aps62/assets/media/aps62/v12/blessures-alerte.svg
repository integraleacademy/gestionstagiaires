<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1025" viewBox="0 0 1200 1025" role="img" aria-labelledby="title desc"><title id="title">Blessures par balles et explosions : repères pour l’alerte</title><desc id="desc">Comparaison conceptuelle du déploiement d’un poumon, puis notions d’hémorragie, de pneumothorax, de blast et de projectiles. Aucun soin n’est représenté.</desc><rect width="1200" height="100%" fill="#f2f6fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="42" y="58" font-size="32" fill="#17304d" font-weight="700">Après une balle ou une explosion : comprendre et alerter</text><text x="42" y="100" font-size="21" fill="#30445c" font-weight="400">Une blessure grave peut être peu visible. Décrire les signes et leur évolution, sans diagnostic.</text><text x="42" y="129" font-size="21" fill="#30445c" font-weight="400">L’approche doit être sûre. Les gestes s’apprennent dans la formation pratique prévue.</text><rect x="40" y="160" width="1120" height="328" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="64" y="198" font-size="27" fill="#17304d" font-weight="700">Pneumothorax : présence d’air dans l’espace pleural</text><ellipse cx="238" cy="335" rx="122" ry="103" fill="#eef3f9" stroke="#6e86a2" stroke-width="5"/><ellipse cx="238" cy="335" rx="107" ry="90" fill="#8bc2db" stroke="#437da6" stroke-width="3"/><text x="125" y="460" font-size="22" fill="#17304d" font-weight="700">Poumon déployé</text><ellipse cx="590" cy="335" rx="122" ry="103" fill="#fae6b8" stroke="#6e86a2" stroke-width="5"/><ellipse cx="569" cy="335" rx="66" ry="75" fill="#8bc2db" stroke="#437da6" stroke-width="3"/><text x="477" y="460" font-size="22" fill="#17304d" font-weight="700">Déploiement réduit</text><path d="M672 299 L758 266 H782" fill="none" stroke="#906926" stroke-width="3"/><text x="796" y="263" font-size="20" fill="#30445c" font-weight="400">Air dans l’espace pleural</text><text x="796" y="292" font-size="20" fill="#30445c" font-weight="400">entre poumon et paroi.</text><text x="796" y="321" font-size="20" fill="#30445c" font-weight="400"></text><text x="796" y="350" font-size="20" fill="#30445c" font-weight="400">Schéma de principe :</text><text x="796" y="379" font-size="20" fill="#30445c" font-weight="400">il ne permet pas</text><text x="796" y="408" font-size="20" fill="#30445c" font-weight="400">un diagnostic.</text><rect x="40" y="510" width="550" height="149" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="63" y="545" font-size="25" fill="#17304d" font-weight="700">Hémorragie</text><text x="63" y="581" font-size="21" fill="#30445c" font-weight="400">Perte importante de sang.</text><text x="63" y="610" font-size="21" fill="#30445c" font-weight="400">Elle peut être visible ou interne.</text><text x="63" y="639" font-size="21" fill="#30445c" font-weight="400">Transmettre le saignement observé.</text><rect x="610" y="510" width="550" height="149" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="633" y="545" font-size="25" fill="#17304d" font-weight="700">Pneumothorax</text><text x="633" y="581" font-size="21" fill="#30445c" font-weight="400">Une respiration peut être gênée.</text><text x="633" y="610" font-size="21" fill="#30445c" font-weight="400">Signaler douleur thoracique</text><text x="633" y="639" font-size="21" fill="#30445c" font-weight="400">et difficulté à respirer.</text><rect x="40" y="677" width="550" height="149" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="63" y="712" font-size="25" fill="#17304d" font-weight="700">Blast</text><text x="63" y="748" font-size="21" fill="#30445c" font-weight="400">Le souffle peut léser des organes.</text><text x="63" y="777" font-size="21" fill="#30445c" font-weight="400">Signaler aussi troubles respiratoires</text><text x="63" y="806" font-size="21" fill="#30445c" font-weight="400">ou de l’audition après l’explosion.</text><rect x="610" y="677" width="550" height="149" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="633" y="712" font-size="25" fill="#17304d" font-weight="700">Projectiles et impacts</text><text x="633" y="748" font-size="21" fill="#30445c" font-weight="400">Fragments projetés, chute ou choc.</text><text x="633" y="777" font-size="21" fill="#30445c" font-weight="400">L’aspect extérieur ne suffit pas</text><text x="633" y="806" font-size="21" fill="#30445c" font-weight="400">à apprécier les lésions internes.</text><rect x="40" y="853" width="1120" height="108" rx="18" fill="#e5eefb" stroke="#bbd0ed"/><text x="62" y="888" font-size="24" fill="#17304d" font-weight="700">Alerte depuis la zone sûre</text><text x="62" y="922" font-size="20" fill="#30445c" font-weight="400">Lieu et accès · dangers · victimes comptées ou estimation précisée · signes · source · inconnues.</text><text x="42" y="1000" font-size="17" fill="#516780" font-weight="400">APS · Repères théoriques, sans gestes médicaux · Édition du 12 octobre 2026</text></g></svg>
