<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Familles de matériels : reconnaissance visuelle sûre</title><desc id="desc">Six silhouettes de familles d’armes, avec limites d’identification. Aucune manipulation n’est enseignée.</desc><rect width="1200" height="100%" fill="#f2f6fb"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="42" y="58" font-size="34" fill="#17304d" font-weight="700">Reconnaître une famille, décrire ce qui est visible</text><text x="42" y="99" font-size="22" fill="#30445c" font-weight="400">Silhouettes d’étude sans échelle. Aucun mécanisme ni maniement.</text><text x="42" y="128" font-size="22" fill="#30445c" font-weight="400">Sur le site : rester protégé, signaler les faits et les incertitudes.</text><rect x="40" y="160" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="62" y="195" font-size="25" fill="#17304d" font-weight="700">1 · Pistolet</text><text x="62" y="224" font-size="18" fill="#516780" font-weight="400">Arme de poing compacte</text><g transform="translate(132 224) scale(.72)"><path d="M15 12 H285 V53 H132 L105 135 H55 L72 55 H15 Z" fill="#294a70"/></g><text x="62" y="360" font-size="18" fill="#17304d" font-weight="400">Partie supérieure allongée et poignée.</text><rect x="610" y="160" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="632" y="195" font-size="25" fill="#17304d" font-weight="700">2 · Revolver</text><text x="632" y="224" font-size="18" fill="#516780" font-weight="400">Arme de poing compacte</text><g transform="translate(702 224) scale(.72)"><path d="M135 22 H330 V48 H144 L118 80 L92 130 H50 L75 61 H52 V20 H130 Z" fill="#294a70"/><circle cx="116" cy="45" r="34" fill="#52769e"/></g><text x="632" y="360" font-size="18" fill="#17304d" font-weight="400">Barillet représenté dans la silhouette.</text><rect x="40" y="402" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="62" y="437" font-size="25" fill="#17304d" font-weight="700">3 · Fusil d’assaut</text><text x="62" y="466" font-size="18" fill="#516780" font-weight="400">Arme longue</text><g transform="translate(132 466) scale(.72)"><path d="M8 39 L78 30 V49 H141 V33 H208 L232 43 H350 V63 H238 L220 75 H204 L195 125 L159 114 L167 77 H146 L128 113 H107 L114 72 H74 L8 90 Z" fill="#294a70"/></g><text x="62" y="602" font-size="18" fill="#17304d" font-weight="400">Crosse, poignée et chargeur saillant.</text><rect x="610" y="402" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="632" y="437" font-size="25" fill="#17304d" font-weight="700">4 · Fusil de chasse</text><text x="632" y="466" font-size="18" fill="#516780" font-weight="400">Exemple à deux canons</text><g transform="translate(702 466) scale(.72)"><path d="M5 55 L91 26 H142 V41 H350 V57 H148 L126 75 H88 L25 115 H5 Z" fill="#294a70"/><path d="M150 48 H350" stroke="#95b1d1" stroke-width="3"/></g><text x="632" y="602" font-size="18" fill="#17304d" font-weight="400">D’autres modèles ont une autre forme.</text><rect x="40" y="644" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="62" y="679" font-size="25" fill="#17304d" font-weight="700">5 · Fusil à pompe</text><text x="62" y="708" font-size="18" fill="#516780" font-weight="400">Arme longue</text><g transform="translate(132 708) scale(.72)"><path d="M5 62 L80 30 H156 V44 H355 V59 H175 V69 H146 L135 84 H94 L25 118 H5 Z" fill="#294a70"/><rect x="189" y="60" width="107" height="23" rx="5" fill="#52769e"/></g><text x="62" y="844" font-size="18" fill="#17304d" font-weight="400">Garde-main représenté sous le canon.</text><rect x="610" y="644" width="550" height="224" rx="18" fill="#fff" stroke="#d7e2ef"/><text x="632" y="679" font-size="25" fill="#17304d" font-weight="700">6 · Lance-roquettes</text><text x="632" y="708" font-size="18" fill="#516780" font-weight="400">Exemple de silhouette tubulaire</text><g transform="translate(702 708) scale(.72)"><path d="M15 38 H325 L350 25 V95 L325 80 H15 Z" fill="#294a70"/><rect x="92" y="80" width="24" height="42" rx="4" fill="#294a70"/><path d="M185 80 L225 80 L220 108 L183 108 Z" fill="#52769e"/></g><text x="632" y="844" font-size="18" fill="#17304d" font-weight="400">Un tube vu seul ne confirme pas une arme.</text><rect x="40" y="901" width="1120" height="100" rx="18" fill="#e5eefb" stroke="#bbd0ed"/><text x="62" y="934" font-size="20" fill="#30445c" font-weight="400">À ne pas déduire : modèle exact, calibre, chargement, portée ou état de fonctionnement.</text><text x="62" y="963" font-size="20" fill="#30445c" font-weight="400">Matériel factice : statut contrôlé par le formateur ; une ressemblance n’est pas une garantie.</text><text x="42" y="1040" font-size="17" fill="#516780" font-weight="400">APS · Théorie de la prévention du terrorisme · Édition du 12 octobre 2026</text></g></svg>
