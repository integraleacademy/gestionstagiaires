name: EDOF acceptance and enrolment

on:
  pull_request:
    paths:
      - 'edof*.py'
      - 'Dockerfile'
      - 'scripts/build_edof_crm_cassandre.py'
      - 'templates/emails/edof_cpf_received.html'
      - 'templates/emails/_edof_crm_*.html'
      - 'static/images/email/crm-logo.png'
      - 'cpf_provider.py'
      - 'integrale_edof_registration.py'
      - 'integrale_edof_dashboard.py'
      - 'integrale_edof_views.py'
      - 'static/js/edof*feedback.js'
      - 'static/css/integrale-edof.css'
      - 'templates/_edof*.html'
      - 'templates/integrale_edof.html'
      - 'tests/test_edof*.py'
      - 'tests/test_edof_proposal_feedback.py'
      - '.github/workflows/edof-enrolment-checks.yml'

permissions:
  contents: read

jobs:
  acceptance-and-enrolment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /campus/*.py
            /templates/
            /static/css/
            /static/js/
            /static/style.css
            /static/logo-integrale.png
            /static/images/email/cassandre-signature.png
            /static/images/email/crm-logo.png
            /scripts/build_edof_cpf_assets.py
            /scripts/build_edof_crm_cassandre.py
            /tests/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.0.0 pytest cryptography requests python-dotenv beautifulsoup4 playwright==1.64.1 'Pillow>=11.3,<13'
      - run: python scripts/build_edof_cpf_assets.py
      - run: python scripts/build_edof_crm_cassandre.py
      - run: python -m playwright install --with-deps chromium
      - run: python -m py_compile edof_cpf_appointment_mail.py integrale_edof_sync.py integrale_edof_dashboard.py edof_server_test.py
      - run: python -c "from jinja2 import Environment, FileSystemLoader; Environment(loader=FileSystemLoader('templates')).get_template('integrale_edof.html')"
      - run: python -m pytest -q tests/test_edof_cpf_email_images.py tests/test_edof_cpf_appointment_mail.py tests/test_edof_enrolment.py tests/test_integrale_edof_dashboard.py tests/test_edof_navigation.py tests/test_edof_proposals.py tests/test_edof_proposal_feedback.py tests/test_edof_feedback.py tests/test_cpf_native_search.py tests/test_edof_matching.py tests/test_edof_invoicing.py tests/test_edof_dossier_dates.py tests/test_edof_day_session.py tests/test_edof_billing.py tests/test_edof_declarations.py tests/test_edof_server_test.py tests/test_edof_history.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: edof-enrolment-screenshots
          path: /tmp/edof-*.png
          if-no-files-found: ignore
          retention-days: 7
