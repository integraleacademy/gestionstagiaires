name: EDOF acceptance and enrolment

on:
  pull_request:
    paths:
      - 'edof_enrolment_watch.py'
      - 'edof_server_browser.py'
      - 'integrale_edof_registration.py'
      - 'integrale_edof_dashboard.py'
      - 'static/js/edof*feedback.js'
      - 'static/css/integrale-edof.css'
      - 'templates/_edof*.html'
      - 'templates/integrale_edof.html'
      - 'tests/test_edof_enrolment.py'
      - 'tests/test_edof_proposal_feedback.py'
      - '.github/workflows/edof-enrolment-checks.yml'

permissions:
  contents: read

jobs:
  acceptance-and-enrolment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /templates/
            /static/css/
            /static/js/
            /tests/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.0.0 pytest cryptography requests python-dotenv beautifulsoup4 playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_edof_enrolment.py tests/test_integrale_edof_dashboard.py tests/test_edof_proposals.py tests/test_edof_proposal_feedback.py tests/test_edof_feedback.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: edof-enrolment-screenshots
          path: /tmp/edof-*.png
          if-no-files-found: ignore
          retention-days: 7
