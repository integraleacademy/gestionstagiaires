name: VTC - aperçu de narration D.02

on:
  push:
    branches: [codex/vtc-natural-voice-pilot-20261013]
    paths:
      - .github/workflows/vtc-voice-preview.yml
      - scripts/vtc/render_voice_preview.py
      - scripts/vtc/voice_preview_d02.json

permissions: {}

concurrency:
  group: vtc-voice-preview-d02
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'integraleacademy/gestionstagiaires'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /elearning_native/vtc/lesson_video_scripts_v10/D.json
            /elearning_native/vtc/video_quality_v11.json
            /elearning_native/vtc/assets/media/vtc/module-d.webp
      - name: Installer les outils de génération
        run: python3 -m pip install --disable-pip-version-check edge-tts==7.2.8 Pillow==12.3.0 av==19.0.1 imageio-ffmpeg==0.6.0 certifi
      - name: Générer et contrôler la narration autorisée
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/vtc/render_voice_preview.py --render
      - name: Enregistrer uniquement l’aperçu sur la branche de préparation
        run: |
          test "${GITHUB_REF_NAME}" = "codex/vtc-natural-voice-pilot-20261013"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse elearning_native/vtc/assets/media/vtc/voice-preview-d02/
          if ! git diff --cached --quiet; then
            git commit -m "Produire l’aperçu de narration VTC D.02 avec Remy à vitesse normale"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
