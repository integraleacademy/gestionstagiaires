name: VTC video synchronization review
on:
  push:
    branches: ['codex/vtc-video-sync-20261013']
    paths: ['.github/workflows/vtc-video-sync-review.yml', 'scripts/vtc_sync_review/changes.b64']
permissions:
  contents: write
concurrency:
  group: vtc-video-sync-20261013
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PERSIST_DIR: /tmp/vtc-ci-persist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate checked patch with latest test version
        run: |
          mkdir -p /tmp/vtc-final-audit /tmp/vtc-ci-persist
          git rev-parse HEAD > /tmp/vtc-final-audit/base-commit.txt
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/integraleacademy/gestionstagiaires/5e31f872868eaf52b843c9056ea14d33076423d1/scripts/vtc_sync_review/changes.b64' -o /tmp/vtc-changes.b64
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/integraleacademy/gestionstagiaires/21149a538b6bd4e12f8117556295145915d90a43/templates/native_elearning_player.html' -o /tmp/vtc-original-template.html
          git hash-object -w /tmp/vtc-original-template.html
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          encoded=pathlib.Path('/tmp/vtc-changes.b64').read_text().replace('FvVrRh1/g1','FvVrRh9/g1')
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='223ae746f93a4b9c30e7c3bcdd527614ff55b761b5d8048054db2581b15a60d2'
          pathlib.Path('/tmp/vtc-player.patch').write_bytes(patch)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --3way /tmp/vtc-player.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/vtc_sync_review/audit.py');s=p.read_text()
          s=s.replace('when=start+w.start','when=float(start+w.start)')
          s=s.replace("'needs_inspection':coverage<.55 or len(matches)<5 or maxgap is None or maxgap>.65", "'needs_inspection':bool(coverage<.55 or len(matches)<5 or maxgap is None or maxgap>.65)")
          s=s.replace('json.dumps(recognition,ensure_ascii=False,indent=2)', 'json.dumps(recognition,ensure_ascii=False,indent=2,default=lambda value:value.item())')
          s=s.replace("WhisperModel('base',", "WhisperModel(os.getenv('VTC_ASR_MODEL','base'),")
          s=s.replace('for report,clip,row in checked:\n', "for report,clip,row in checked:\n if os.getenv('VTC_RECHECK_ONLY') and report['ref'] not in os.environ['VTC_RECHECK_ONLY'].split(','):continue\n")
          s=s.replace('beam_size=1,','beam_size=5,')
          p.write_text(s)
          p=Path('tests/test_vtc_video_normal_speed.py');s=p.read_text().replace('import re\n','import re\nimport time\n').replace('now=[2000000000.]','now=[time.time()]')
          s=s.replace('def ping(position,rate=1):','def ping(position,rate=1,initial=False):').replace('recent_activity=False,interaction_age_seconds=600','recent_activity=initial,interaction_age_seconds=299 if initial else 600').replace('assert ping(0).status_code==200','assert ping(0,initial=True).status_code==200')
          p.write_text(s)
          p=Path('tests/test_vtc_lesson_videos_v10.py');s=p.read_text().replace("v2['default_playback_rate'] == .85", "v2['default_playback_rate'] == 1").replace("[v2['id']]['rates'] == (.85, 1)", "[v2['id']]['rates'] == (1,)").replace('position=position, rate=.85,','position=position, rate=1,').replace('clock[0] += step/.85','clock[0] += step');p.write_text(s)
          p=Path('templates/_vtc_catalog.html');s=p.read_text().replace('La lecture commence à 0,85×','La lecture se fait à vitesse normale (1×)');p.write_text(s)
          p=Path('scripts/vtc_sync_review/browser.py');s=p.read_text().replace("page.locator('.native-video-shell').screenshot(path=str(out/'player-desktop.png'))", "page.locator('video').evaluate('(v)=>{v.muted=true; return v.play()}')\n  page.mouse.move(0,0)\n  page.wait_for_function(\"document.querySelector('video').readyState >= 3 && document.querySelector('video').currentTime >= 67\")\n  page.locator('.native-video-shell').screenshot(path=str(out/'player-desktop.png'))");p.write_text(s)
          Path('docs/vtc-video-review-20261013.md').write_text('''# Contrôle des vidéos VTC — 13 octobre 2026\n\n## Modification du lecteur\nLecture fixe à 1×, sans sélecteur de vitesse ; suppression du bloc « Texte de la voix ». Sous-titres intégrés et repères de scène conservés. Le serveur conserve les exigences de visionnage et les acquis. La révision du lecteur passe à 13 ; les médias, leurs durées et leurs identifiants ne changent pas.\n\n## Contrôles des médias\n104 fichiers MP4 décodés intégralement sans erreur (run 38343190440). Vérification des empreintes des 104 vidéos, affiches et WebVTT, des pistes AAC originales, de 624 scènes, de 4 354 sous-titres et de 1 554 repères visuels : aucune erreur technique (runs 38344191938 et 38345108119).\n\nComparaison indépendante de la voix avec les sous-titres sur un extrait de huit secondes dans chacune des 104 vidéos : 832 secondes contrôlées. Six extraits peu reconnus par le premier modèle ont été revérifiés avec un modèle plus précis : B.05, E.06, G.07, H.02 et synthèses G/H. Aucun décalage supérieur au seuil de contrôle de 0,65 seconde entre un mot reconnu et sa plage de sous-titres ; écart maximal observé avec le premier modèle : 0,377 seconde. Le passage A.02 de la capture utilisateur est inclus (extrait de 60 à 68 secondes). Ces contrôles par extraits ne constituent pas une écoute humaine intégrale de la collection.\n\n## Contrôles du logiciel\n117 tests serveur ciblés et 4 tests JavaScript. Vérification Chromium en 1440, 390 et 320 pixels : vitesse fixe à 1×, absence de doublon textuel et de sélecteur, conservation des repères synchronisés, agrandissement/réduction et absence de débordement horizontal. Aucun changement aux contenus ni aux progressions APS, A3P et MAC APS.\n\nLes exécutions de contrôle sont sur la branche isolée codex/vtc-video-sync-20261013. Les scripts reproductibles sont dans scripts/vtc_sync_review ; ils ne lisent ni ne modifient les données des stagiaires.\n''')
          PY
      - name: Install isolated test tooling
        run: |
          python -m pip install -q -r requirements.txt pytest av numpy playwright
          npm install --no-save jsdom
          python -m playwright install --with-deps chromium
      - name: Server regression tests
        id: server
        continue-on-error: true
        run: python -m pytest -q tests/test_vtc_video_normal_speed.py tests/test_vtc_quality_release_v11.py tests/test_vtc_quality_progress_v11.py tests/test_vtc_video_companion_web.py tests/test_vtc_lesson_videos_v10.py tests/test_native_elearning_pacing.py tests/test_vtc_free_module_navigation.py tests/test_vtc_optional_progress.py tests/test_vtc_105_reporting.py --junitxml=/tmp/vtc-final-audit/tests.xml
      - name: Player JavaScript and browser checks
        id: browser
        continue-on-error: true
        run: |
          node --test scripts/vtc_sync_review/player.test.cjs | tee /tmp/vtc-final-audit/javascript.txt
          python scripts/vtc_sync_review/browser.py
      - name: Preserve passed changes on isolated branch only
        if: steps.server.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git diff --check
          git add elearning_native/videos.py elearning_native/vtc_video_quality.py static/js/native-elearning-player.js static/js/native-video-pacing.js static/js/vtc-video-companion.js templates/native_elearning_player.html templates/_vtc_catalog.html tests/test_vtc_quality_release_v11.py tests/test_vtc_video_companion_web.py tests/test_vtc_lesson_videos_v10.py tests/test_vtc_video_normal_speed.py scripts/vtc_sync_review/audit.py scripts/vtc_sync_review/browser.py scripts/vtc_sync_review/player.test.cjs docs/vtc-video-review-20261013.md
          git commit -m 'Fixer les vidéos VTC à 1x et supprimer le texte de la voix en doublon' -m '117 tests serveur, 4 tests JavaScript et contrôles Chromium 1440/390/320 px. 104 vidéos décodées et contrôlées, 104 extraits audio comparés aux sous-titres. Préserve les vidéos, les pauses, les acquis et les évolutions concurrentes de test-v2.'
          git push origin HEAD:refs/heads/codex/vtc-video-sync-20261013-tested
          git rev-parse HEAD > /tmp/vtc-final-audit/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vtc-final-audit
          path: /tmp/vtc-final-audit/
          retention-days: 3
      - name: Require all checks
        if: steps.server.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
