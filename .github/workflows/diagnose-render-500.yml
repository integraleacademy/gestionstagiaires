name: Diagnose Render 500

on:
  pull_request:
    branches:
      - test-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: diagnostic
      PERSIST_DIR: /tmp/gestionstagiaires-diagnostic
      AUTO_RESTORE_FROM_BACKUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Diagnose
        run: |
          mkdir -p "$PERSIST_DIR"
          python - <<'PY'
          import traceback
          try:
              import app as application
              application.app.config.update(TESTING=True, PROPAGATE_EXCEPTIONS=True)
              with application.app.test_client() as client:
                  for path in ("/", "/admin/login", "/api/health"):
                      print("GET", path, flush=True)
                      response = client.get(path, follow_redirects=False)
                      print("STATUS", response.status_code, flush=True)
                      if response.status_code >= 500:
                          print(response.get_data(as_text=True)[:1000], flush=True)
                          raise RuntimeError(f"HTTP {response.status_code} on {path}")
          except Exception:
              traceback.print_exc()
              raise
          PY
