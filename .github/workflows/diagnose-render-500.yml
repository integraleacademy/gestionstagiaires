name: Diagnose Render 500

on:
  pull_request:
    branches:
      - test-v2

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: diagnostic
      PERSIST_DIR: /tmp/gestionstagiaires-diagnostic
      AUTO_RESTORE_FROM_BACKUP: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Diagnose and report
        shell: bash
        run: |
          pip install -q -r requirements.txt
          mkdir -p "$PERSIST_DIR"
          set +e
          python - <<'PY' > diagnostic.txt 2>&1
          import traceback
          try:
              import app as application
              application.app.config.update(TESTING=True, PROPAGATE_EXCEPTIONS=True)
              with application.app.test_client() as client:
                  for path in ("/", "/admin/login", "/api/health"):
                      print("GET", path, flush=True)
                      response = client.get(path, follow_redirects=False)
                      print("STATUS", response.status_code, flush=True)
                      if response.status_code >= 500:
                          print(response.get_data(as_text=True)[:1000], flush=True)
                          raise RuntimeError(f"HTTP {response.status_code} on {path}")
          except Exception:
              traceback.print_exc()
              raise
          PY
          status=$?
          set -e
          tail -n 200 diagnostic.txt > diagnostic-comment.txt
          {
            echo '### Diagnostic automatique Render 500'
            echo
            echo '```text'
            cat diagnostic-comment.txt
            echo '```'
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-comment.md
          exit "$status"
