name: Diagnose Render 500

on:
  push:
    branches:
      - diagnostic-render-500

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: diagnostic-secret
      ADMIN_USER: diagnostic@example.com
      ADMIN_PASSWORD: diagnostic-password
      SECRETARY_USER: secretary@example.com
      SECRETARY_PASSWORD: diagnostic-password
      PERSIST_DIR: /tmp/gestionstagiaires-diagnostic
      AUTO_RESTORE_FROM_BACKUP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Flask route diagnostics
        run: |
          mkdir -p "$PERSIST_DIR"
          python - <<'PY'
          import traceback
          import app as application

          flask_app = application.app
          flask_app.config.update(TESTING=True, PROPAGATE_EXCEPTIONS=True)

          paths = ["/", "/admin/login", "/api/health"]
          with flask_app.test_client() as client:
              for path in paths:
                  print(f"\n===== GET {path} =====")
                  try:
                      response = client.get(path, follow_redirects=False)
                      print("status:", response.status_code)
                      print("location:", response.headers.get("Location"))
                      print(response.get_data(as_text=True)[:2000])
                      if response.status_code >= 500:
                          raise RuntimeError(f"HTTP {response.status_code} on {path}")
                  except Exception:
                      traceback.print_exc()
                      raise
          PY
