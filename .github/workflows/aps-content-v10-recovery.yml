name: APS — reprendre la publication v10 après intégration des accès et mails

on:
  push:
    branches: [test-v2]
    paths:
      - scripts/aps62_v10_recovery.json
  workflow_dispatch:

permissions: {}

# Same lock as the original render/publication and v9 workflows.
concurrency:
  group: aps-improvements-test-v2
  cancel-in-progress: false

jobs:
  prepare:
    name: Vérifier les sources inchangées et les quatre lots terminés
    if: github.repository == 'integraleacademy/gestionstagiaires' && github.ref == 'refs/heads/test-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish_enabled: ${{ steps.release.outputs.publish_enabled }}
      artifact_ids: ${{ steps.artifacts.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier la base concurrente approuvée et l'identité des auteurs et médias
        id: release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from scripts.aps62_v10.practical_cases import THREAT_CALL_AUDIO
          root = Path('elearning_native/aps62')
          release = json.loads(Path('scripts/aps62_v10_recovery.json').read_text())
          expected = dict(version='20261010-aps62-v10', branch='test-v2', enabled=True,
              publish_enabled=True, shards=4, media_revision=8, source_run_id=38024849922,
              source_run_attempt=1, source_sha='9f144f72768f5ddeedf7a9fc1c4766fcf40e9425',
              reviewed_base_sha='ab31ed34ca0e86606b6db4ad33f8e91f48091628')
          for key, value in expected.items():
              assert release[key] == value, (key, release.get(key))
          source, reviewed, launch = release['source_sha'], release['reviewed_base_sha'], os.environ['GITHUB_SHA']
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, reviewed], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', reviewed, launch], check=True)
          concurrent = {
              'app.py', 'docs/elearning-orders.md', 'elearning_groups.py',
              'elearning_native/web.py', 'elearning_orders.py',
              'templates/manuals/elearning_access.html', 'templates/manuals/elearning_email.html',
              'tests/test_elearning_learner_redirect.py', 'tests/test_elearning_mail_identity.py',
              'tests/test_elearning_orders.py',
          }
          recovery = {'.github/workflows/aps-content-v10-recovery.yml', 'scripts/aps62_v10_recovery.json'}
          assert set(git('diff', '--name-only', source, reviewed).splitlines()) == concurrent
          assert set(git('diff', '--name-only', reviewed, launch).splitlines()) == recovery
          assert set(git('diff', '--name-only', source, launch).splitlines()) == concurrent | recovery
          # Every approved runtime change must be exactly the reviewed blob, not just a permitted path.
          for path in concurrent:
              assert git('rev-parse', f'{reviewed}:{path}') == git('rev-parse', f'{launch}:{path}'), path
          # Exhaustive diff allowlist above also covers transitive imports, fonts, historical
          # v7/v9 data and source images. This explicit check documents the author/media boundary.
          immutable = ('scripts/aps62_v3/', 'scripts/aps62_v5/', 'scripts/aps62_v6/',
              'scripts/aps62_v9/', 'scripts/aps62_v10/', 'scripts/academy_videos/',
              'scripts/render_aps62_v5.py', 'scripts/render_aps62_v8.py',
              'scripts/build_aps62_v10.py', 'elearning_native/aps62/')
          subprocess.run(['git', 'diff', '--exit-code', source, launch, '--', *immutable], check=True)
          assert json.loads((root / 'manifest.json').read_text())['version'] == '20261007-aps62-v9'
          for path in (root / 'video_manifest_v8.json', root / 'video_scripts_v8.json',
                       root / 'assets/media/aps62/v8', root / 'exams/20261010-aps62-v10'):
              assert not path.exists(), f'Edition already exists: {path}'
          assert not list((root / 'courses').glob('*/20261010-aps62-v10.json'))
          folder = root / 'assets/media/aps62/v10'
          metadata = json.loads((folder / 'aps62-12-05-appel-exercice.json').read_text())
          assert metadata['transcript'] == THREAT_CALL_AUDIO['transcript']
          assert metadata['spoken_text'] == 'Exercice fictif. ' + THREAT_CALL_AUDIO['narration_text']
          assert metadata['text_sha256'] == hashlib.sha256(metadata['spoken_text'].encode()).hexdigest()
          audio = root / 'assets' / metadata['src']
          assert metadata['src'] == 'media/aps62/v10/aps62-12-05-appel-exercice.mp3'
          assert audio.is_file() and audio.stat().st_size < 5 * 1024 * 1024
          assert metadata['audio_sha256'] == hashlib.sha256(audio.read_bytes()).hexdigest()
          assert (root / 'assets' / metadata['captions']).is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish_enabled=true\n')
          PY
      - name: Vérifier les quatre jobs réussis et les quatre artifacts non expirés du run source
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          release = json.loads(Path('scripts/aps62_v10_recovery.json').read_text())
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'integraleacademy/gestionstagiaires'
          run_id, attempt = release['source_run_id'], release['source_run_attempt']
          base = f'https://api.github.com/repos/{repository}/actions'
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = get(f'/runs/{run_id}')
          assert run['id'] == run_id and run['head_sha'] == release['source_sha']
          assert run['repository']['full_name'] == repository and run['head_branch'] == 'test-v2'
          assert run['path'] == '.github/workflows/aps-content-v10.yml'
          assert run['run_attempt'] == attempt and run['status'] == 'completed'
          assert run['conclusion'] in ('success', 'failure'), 'Cancelled or incomplete source run'
          def pages(path, key):
              rows = []
              for page in range(1, 11):
                  response = get(f'{path}?per_page=100&page={page}')
                  rows.extend(response[key])
                  if len(rows) >= response['total_count']:
                      return rows
              raise AssertionError('Unexpected API pagination size')
          jobs = pages(f'/runs/{run_id}/attempts/{attempt}/jobs', 'jobs')
          expected_jobs = {f'Produire le lot {shard} / 4' for shard in range(4)}
          render_jobs = [job for job in jobs if job['name'].startswith('Produire le lot ')]
          assert len(render_jobs) == 4 and {job['name'] for job in render_jobs} == expected_jobs
          for job in render_jobs:
              assert job['status'] == 'completed' and job['conclusion'] == 'success', job['name']
              assert job['head_sha'] == release['source_sha'] and job['run_attempt'] == attempt
              shard = job['name'].removeprefix('Produire le lot ').removesuffix(' / 4')
              assert job['id'] == release['source_render_job_ids'][shard]
          artifacts = pages(f'/runs/{run_id}/artifacts', 'artifacts')
          names = {f'aps62-v10-shard-{shard}' for shard in range(4)}
          selected = [artifact for artifact in artifacts if artifact['name'] in names]
          assert len(selected) == 4 and {a['name'] for a in selected} == names
          pinned = {a['name']: a for a in release['source_artifacts']}
          assert set(pinned) == names and len(release['source_artifacts']) == 4
          for artifact in selected:
              for key in ('id', 'name', 'size_in_bytes', 'digest'):
                  assert artifact[key] == pinned[artifact['name']][key], (artifact['name'], key)
              assert not artifact['expired'] and artifact['size_in_bytes'] > 0, artifact['name']
              origin = artifact['workflow_run']
              assert origin['id'] == run_id and origin['head_sha'] == release['source_sha']
              assert origin['head_branch'] == 'test-v2'
          ids = ','.join(str(a['id']) for a in sorted(selected, key=lambda a: a['name']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('artifact_ids=' + ids + '\n')
          print(f'4 jobs réussis et 4 artifacts validés : run {run_id}, tentative {attempt}.')
          PY

  publish:
    name: Vérifier puis publier l'édition v10 complète
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish_enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      APS62_VERIFY_FULL_DECODE: '1'
      PERSIST_DIR: /tmp/aps62-v10-test-data
      SECRET_KEY: aps-v10-ci-synthetic-key-not-used-in-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Télécharger les quatre artifacts vérifiés du lancement source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_ids }}
          run-id: '38024849922'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/aps62-lots
          merge-multiple: true
      - name: Vérifier la provenance et fusionner les lots sans écraser d'édition
        run: |
          python - <<'PY'
          import json, os, shutil, tarfile
          from pathlib import Path
          from scripts.aps62_v10.video_content import courses
          root = Path('elearning_native/aps62')
          authored = courses()
          release = json.loads(Path('scripts/aps62_v10_recovery.json').read_text())
          merged, media = {}, set()
          for shard in range(4):
              path = Path(os.environ['RUNNER_TEMP']) / 'aps62-lots' / f'aps62-shard-{shard}.tar'
              with tarfile.open(path) as archive:
                  name, proof = f'manifests/shard-{shard}.json', f'provenance/shard-{shard}.json'
                  provenance = json.load(archive.extractfile(proof))
                  for key, expected in dict(version='20261010-aps62-v10', media_revision=8,
                      repository=os.environ['GITHUB_REPOSITORY'], source_sha=release['source_sha'],
                      run_id=str(release['source_run_id']), shard=shard, shards=4).items():
                      assert provenance[key] == expected, (shard, key)
                  assert int(provenance['run_attempt']) == release['source_run_attempt']
                  data = json.load(archive.extractfile(name))
                  expected = {sid for i, sid in enumerate(sorted(authored)) if i % 4 == shard}
                  assert set(data) == expected, (shard, set(data) ^ expected)
                  assert not (set(merged) & set(data)), 'Duplicate dossier'
                  for sid, row in data.items():
                      assert row['transcript'] == authored[sid]['transcript'], sid
                      assert row['render_revision'] == 8, sid
                      for key, ext in (('src', 'mp4'), ('poster', 'jpg'), ('captions', 'vtt')):
                          assert row[key] == f'media/aps62/v8/{sid}.{ext}'
                  expected_media = {str(root / 'assets' / row[key])
                                    for row in data.values() for key in ('src', 'poster', 'captions')}
                  members = archive.getmembers()
                  assert len(members) == len(expected_media) + 2, 'Duplicate archive entries'
                  assert {m.name for m in members} == expected_media | {name, proof}
                  for member in members:
                      assert member.isfile() and not member.issym(), member.name
                      if member.name in (name, proof):
                          continue
                      assert member.name.startswith(str(root / 'assets/media/aps62/v8') + '/')
                      assert '..' not in Path(member.name).parts and member.name not in media
                      assert 0 < member.size < 95 * 1024 * 1024, member.name
                      media.add(member.name)
                      target = Path(member.name)
                      assert not target.exists(), f'Already published: {target}'
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.extractfile(member) as source, target.open('wb') as output:
                          shutil.copyfileobj(source, output)
                  merged.update(data)
          assert set(merged) == set(authored) and len(merged) == 62
          assert not (root / 'video_manifest_v8.json').exists()
          (root / 'video_manifest_v8.json').write_text(
              json.dumps(dict(sorted(merged.items())), ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Normaliser la fin des nouveaux sous-titres WebVTT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('elearning_native/aps62/assets/media/aps62/v8').glob('*.vtt'))
          assert len(files) == 62
          for path in files:
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Installer les outils de validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1 edge-tts==7.2.8
      - name: Vérifier le décodage réel de l'appel d'exercice
        run: ffmpeg -nostdin -v error -xerror -i elearning_native/aps62/assets/media/aps62/v10/aps62-12-05-appel-exercice.mp3 -f null -
      - name: Créer l'édition v10 sans modifier les éditions précédentes
        run: python scripts/build_aps62_v10.py
      - name: Vérifier les médias, contenus, productions et accès privés
        run: |
          python -m pytest tests/test_aps62_v10_*.py tests/test_aps62_production*.py tests/test_aps62_v9_questions.py tests/test_aps62_v9_remediation.py tests/test_native_elearning_video.py tests/test_native_elearning_video_presence.py tests/test_aps62_guided.py tests/test_aps62_readability.py tests/test_elearning_mail_identity.py tests/test_elearning_learner_redirect.py tests/test_elearning_orders.py tests/test_native_elearning_web.py tests/test_native_elearning_exams.py tests/test_native_elearning_practice.py tests/test_elearning_reporting.py -q
      - name: Vérifier les parcours et lecteurs côté navigateur
        run: |
          npm install --prefix "$RUNNER_TEMP/aps-ui-checks" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/aps-ui-checks/node_modules" node --test tests/test_aps62_production_ui.cjs tests/test_native_elearning_video_ui.cjs tests/test_native_elearning_player_ui.cjs tests/test_aps62_guided_ui.cjs tests/test_native_elearning_exam_ui.cjs
      - name: Vérifier le périmètre exact du commit
        run: |
          git add -- elearning_native/aps62
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          root = 'elearning_native/aps62/'
          mutable = {'manifest.json', 'regulatory_review.json'}
          new_metadata = {'video_manifest_v8.json', 'video_scripts_v8.json'}
          entries = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '-z']).decode().split('\0')
          changed = []
          for status, path in zip(entries[0:-1:2], entries[1:-1:2]):
              assert path.startswith(root) and status in ('A', 'M'), (status, path)
              relative = path[len(root):]
              allowed = relative in mutable | new_metadata or re.fullmatch(
                  r'(assets/media/aps62/v8/aps62-\d{2}-\d{2}\.(mp4|jpg|vtt)|'
                  r'courses/academy-aps62-\d{2}/20261010-aps62-v10\.json|'
                  r'exams/20261010-aps62-v10/(module-\d{2}|final)\.json)', relative)
              assert allowed, path
              assert relative in mutable or status == 'A', f'Historical file modified: {path}'
              assert Path(path).stat().st_size < 95 * 1024 * 1024, path
              changed.append(path)
          assert len([p for p in changed if p.endswith('.mp4')]) == 62
          assert len([p for p in changed if '/courses/' in p]) == 15
          assert len([p for p in changed if '/exams/' in p]) == 16
          assert sum(Path(p).stat().st_size for p in changed) < 1.8 * 1024**3, 'Release exceeds safe Git push size'
          print(f'{len(changed)} fichiers autorisés, anciennes éditions conservées')
          PY
          git diff --cached --check
      - name: Publier sur TEST sans forcer ni écraser les changements concurrents
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publier APS v10 : corrections, cas appliqués et productions individuelles'
          git fetch --no-tags origin test-v2
          git merge-base --is-ancestor "$GITHUB_SHA" origin/test-v2
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', os.environ['GITHUB_SHA'], 'origin/test-v2',
          ]).decode().splitlines()
          protected = (
              'elearning_native/', 'scripts/aps62', 'scripts/render_aps62',
              'scripts/build_aps62', 'scripts/academy_videos/', 'elearning_reporting.py',
              'elearning_orders.py', 'elearning_groups.py', 'manuals_shop.py', 'app.py', 'requirements.txt',
              'static/js/native-elearning', 'static/js/aps62', 'static/css/aps62',
              'templates/native_', 'templates/_aps62', 'templates/admin_native_',
              'templates/elearning_progress.html', 'templates/manuals/elearning_', '.github/workflows/aps-',
              'tests/test_aps62', 'tests/test_native_elearning', 'tests/test_elearning',
          )
          touched = [p for p in paths if p.startswith(protected)]
          assert not touched, f'Protected files changed after recovery launch; publication stopped: {touched}'
          PY
          if ! git rebase origin/test-v2; then
            git rebase --abort
            echo '::error::Changements concurrents incompatibles : les vidéos restent dans les artifacts.'
            exit 1
          fi
          APS62_VERIFY_FULL_DECODE=0 python -m pytest tests/test_aps62_v10_*.py tests/test_aps62_production*.py tests/test_native_elearning_video_presence.py tests/test_aps62_guided.py tests/test_aps62_readability.py tests/test_elearning_mail_identity.py tests/test_elearning_learner_redirect.py tests/test_elearning_orders.py tests/test_native_elearning_web.py tests/test_native_elearning_exams.py tests/test_native_elearning_practice.py tests/test_elearning_reporting.py -q
          git push origin HEAD:refs/heads/test-v2
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          videos = json.loads(Path('elearning_native/aps62/video_manifest_v8.json').read_text())
          seconds = sum(row['duration_seconds'] for row in videos.values())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'APS v10 publié sur test-v2 : 62 vidéos, **{seconds / 3600:.2f} h** de narration et 10 productions individuelles.\n\n')
              summary.write(f'Commit : `{commit}`. Les éditions précédentes sont conservées.\n')
          PY
