name: Isolation du Campus
on:
  pull_request:
    paths:
      - 'campus/**'
      - 'deploy/campus.yaml'
      - 'crm_app.py'
      - 'elearning_native/**.py'
      - 'uv_questionnaire*.py'
      - 'scripts/check_campus_isolation.py'
      - 'templates/campus/**'
      - '.github/workflows/campus-isolation.yml'
permissions:
  contents: read
jobs:
  gestion-et-campus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-campus-check
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CAMPUS_TEST_DATABASE_URL: postgresql://postgres:local-campus-check@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /**
            !/**/*.mp4
            !/**/*.mp3
            !/**/*.mov
            !/**/*.webm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 24 connexions simultanées et redémarrage de la gestion
        run: python scripts/check_campus_isolation.py
      - name: 48 connexions simultanées et 960 réponses vérifiées
        run: python scripts/check_campus_isolation.py --learners 48
