name: Fix login session loop

on:
  pull_request:
    branches:
      - test-v2

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: diagnostic-secret
      PERSIST_DIR: /tmp/gestionstagiaires-login-test
      AUTO_RESTORE_FROM_BACKUP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v2
          fetch-depth: 0
      - name: Apply compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          old = "    issued_at = _session_issue_datetime()\n    return bool(issued_at and issued_at >= cutoff)\n"
          new = "    issued_at = _session_issue_datetime()\n    return issued_at is None or issued_at >= cutoff\n"
          if old not in text:
              raise SystemExit("Expected session validation code not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile app.py
          mkdir -p "$PERSIST_DIR"
          python - <<'PY'
          import app as application
          application.app.config.update(TESTING=True, PROPAGATE_EXCEPTIONS=True)
          with application.app.test_client() as client:
              for route in ("/", "/admin/login", "/api/health"):
                  response = client.get(route, follow_redirects=False)
                  print(route, response.status_code)
                  if response.status_code >= 500:
                      raise SystemExit(f"HTTP {response.status_code} on {route}")
          PY
          git add app.py
          git diff --check
          git commit -m "Restore compatibility for admin sessions"
          git push origin HEAD:test-v2
