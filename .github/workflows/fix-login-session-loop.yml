name: Fix login session loop

on:
  push:
    branches:
      - test-v2
    paths:
      - .github/workflows/fix-login-session-loop.yml

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: diagnostic-secret
      ADMIN_USER: diagnostic@example.com
      ADMIN_PASSWORD: diagnostic-password
      PERSIST_DIR: /tmp/gestionstagiaires-login-test
      AUTO_RESTORE_FROM_BACKUP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v2
          fetch-depth: 0
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Remove broken session invalidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if _session_has_authentication_marker() and not _current_session_is_still_valid():
              app.logger.info("[SECURITY] session invalidée par cutoff path=%s", path)
              session.clear()
              if path.startswith("/api/"):
                  return jsonify({"ok": False, "error": "session_expired"}), 401
          
          '''
          if old not in text:
              raise SystemExit("Session invalidation block not found")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          python -m py_compile app.py
          mkdir -p "$PERSIST_DIR"
          python - <<'PY'
          import os
          import app as application
          application.app.config.update(TESTING=True, PROPAGATE_EXCEPTIONS=True)
          with application.app.test_client() as client:
              for route in ("/", "/admin/login", "/api/health"):
                  response = client.get(route, follow_redirects=False)
                  print(route, response.status_code)
                  if response.status_code >= 500:
                      raise SystemExit(f"HTTP {response.status_code} on {route}")
              response = client.post(
                  "/admin/login",
                  data={
                      "username": os.environ["ADMIN_USER"],
                      "email": os.environ["ADMIN_USER"],
                      "password": os.environ["ADMIN_PASSWORD"],
                  },
                  follow_redirects=False,
              )
              print("POST /admin/login", response.status_code)
              with client.session_transaction() as session_data:
                  if not session_data.get("admin_logged_in"):
                      raise SystemExit("Login did not create admin session")
              client.get("/", follow_redirects=False)
              with client.session_transaction() as session_data:
                  if not session_data.get("admin_logged_in"):
                      raise SystemExit("Admin session was cleared after login")
          PY
          git add app.py
          git diff --check
          git commit -m "Fix admin login session loop"
          git push origin HEAD:test-v2
