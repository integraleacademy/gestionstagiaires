name: A3P 157h30 - verifier la production video Henri
on:
  push:
    branches: [codex/a3p-157h30-20261015]
    paths: [.github/workflows/a3p157-sample.yml]
permissions: {}
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/a3p_157/
            /scripts/aps62_v5/captions.py
            /scripts/academy_videos/assets/
            /elearning_native/*.py
            /elearning_native/a3p_resources/*.json
            /elearning_native/a3p_resources/assets/media/a3p/v1/*.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Installer les outils du pipeline APS existant
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check edge-tts==7.2.8 Pillow==12.3.0
      - name: Produire deux nouvelles capsules et verifier tout leur contenu audiovisuel
        run: python -m scripts.a3p_157.render --limit 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a3p157-sample
          path: elearning_native/a3p_resources/assets/media/a3p/v4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
