name: Codex - accès APS par lien unique

on:
  push:
    branches:
      - codex/aps-elearning-link-only

permissions:
  contents: write

jobs:
  apply-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remplacer les identifiants APS par un lien personnel
        run: python .github/scripts/codex_aps_elearning_link_only.py

      - name: Vérifier le diff
        run: |
          git diff --check
          grep -q 'Lien e-learning APS' templates/admin_trainee.html
          grep -q 'type="url"' templates/admin_trainee.html
          grep -q 'href="{{ aps_link }}"' templates/public_trainee.html
          ! grep -q 'id="editApsElearningPassword"' templates/admin_trainee.html
          ! grep -q 'data-copy-target="apsElearningPassword"' templates/public_trainee.html

      - name: Préparer le stockage persistant de test
        run: |
          sudo mkdir -p /var/data /data
          sudo chown -R "$USER":"$USER" /var/data /data

      - name: Installer les dépendances de test
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Tester le parcours APS e-learning
        run: python -m pytest -q tests/test_aps_elearning.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/admin_trainee.html templates/public_trainee.html tests/test_aps_elearning.py
          git commit -m "Remplacer les identifiants APS par un lien e-learning"
          git push origin HEAD:${GITHUB_REF_NAME}
