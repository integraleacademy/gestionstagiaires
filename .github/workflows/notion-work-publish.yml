name: Notion Work - publier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la PR Work à valider puis publier
        required: true
        type: string

permissions: {}

concurrency:
  group: notion-work-publish
  cancel-in-progress: false

jobs:
  inspect:
    name: Vérifier la PR prioritaire
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_ref: ${{ steps.meta.outputs.head_ref }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      page_id: ${{ steps.meta.outputs.page_id }}
    steps:
      - name: Vérifier le périmètre et l'ordre
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          requested_pr="${INPUT_PR:-${EVENT_PR:-}}"
          case "$requested_pr" in
            ''|*[!0-9]*) echo "::error::Numéro de PR invalide : $requested_pr"; exit 1 ;;
          esac

          pr_json="$(gh pr view "$requested_pr" --repo "$GITHUB_REPOSITORY" --json number,state,baseRefName,headRefName,headRefOid,body,isDraft)"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          base="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
          head_ref="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"

          if [ "$state" != "OPEN" ] || [ "$base" != "main" ]; then exit 0; fi
          if [[ "$head_ref" != work/notion-gestion-stagiaires-* ]]; then exit 0; fi
          if [[ "$body" != *"<!-- notion-page-id:"* ]]; then echo "::error::PR sans marqueur Notion."; exit 1; fi
          if [[ "$body" != *"Checklist"* ]] || [[ "$body" != *"Tests"* ]]; then
            echo "::error::La PR doit documenter la checklist d'acceptation et les tests exécutés."
            exit 1
          fi

          page_id="$(printf '%s\n' "$body" | sed -nE 's/.*<!--[[:space:]]*notion-page-id:[[:space:]]*([0-9a-fA-F-]{32,36})[[:space:]]*-->.*/\1/p' | head -n 1)"
          [ -n "$page_id" ] || { echo "::error::Identifiant Notion introuvable."; exit 1; }

          first_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 100 --json number,headRefName,body --jq '[.[] | select(.headRefName | startswith("work/notion-gestion-stagiaires-")) | select((.body // "") | contains("<!-- notion-page-id:")) | .number] | sort | .[0] // empty')"
          if [ -n "$first_number" ] && [ "$requested_pr" != "$first_number" ]; then
            echo "PR #$requested_pr en attente de la PR #$first_number."
            exit 0
          fi

          echo "pr_number=$requested_pr" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "page_id=$page_id" >> "$GITHUB_OUTPUT"

  test:
    name: Valider la PR sans droit d'écriture
    needs: inspect
    if: needs.inspect.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vérifier la base, le diff et la syntaxe Python
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          [ "$behind" = "0" ] || { echo "::error::La PR est en retard de $behind commit(s) sur main."; exit 1; }
          git diff --check origin/main...HEAD
          changed_py="$(git diff --name-only origin/main...HEAD -- '*.py')"
          if [ -n "$changed_py" ]; then
            while IFS= read -r file; do python -m py_compile "$file"; done <<< "$changed_py"
          fi

  publish:
    name: Publier la PR validée
    needs: [inspect, test]
    if: needs.inspect.outputs.head_sha != '' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Revérifier puis fusionner sans forcer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head_sha }}
          HEAD_REF: ${{ needs.inspect.outputs.head_ref }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,isDraft --jq '[.state,.headRefOid,.isDraft] | @tsv')"
          state="$(printf '%s' "$current" | cut -f1)"
          current_head="$(printf '%s' "$current" | cut -f2)"
          is_draft="$(printf '%s' "$current" | cut -f3)"
          [ "$state" = "OPEN" ] || exit 0
          [ "$current_head" = "$EXPECTED_HEAD" ] || { echo "::error::La tête de la PR a changé après les tests."; exit 1; }

          first_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 100 --json number,headRefName,body --jq '[.[] | select(.headRefName | startswith("work/notion-gestion-stagiaires-")) | select((.body // "") | contains("<!-- notion-page-id:")) | .number] | sort | .[0] // empty')"
          [ -z "$first_number" ] || [ "$PR_NUMBER" = "$first_number" ] || { echo "::error::La PR #$first_number doit être publiée avant."; exit 1; }

          behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_REF}" --jq '.behind_by')"
          [ "$behind" = "0" ] || { echo "::error::La PR n'est plus à jour avec main."; exit 1; }
          if [ "$is_draft" = "true" ]; then gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
