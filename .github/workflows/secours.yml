name: Vérifier la page de secours
on:
  push:
    branches: [infra/int-connect-secours-502]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Lancer la passerelle et simuler une panne du serveur
        run: |
          set -eu
          docker build -t connect-secours-test .
          docker run --network host -e PORT=19078 -e ORIGIN_HOST=origine.test -e UPSTREAM=http://127.0.0.1:19077 --name secours -d connect-secours-test
          python3 verify.py || { docker logs secours; exit 1; }
      - name: Vérifier le routage public en lecture seule
        run: |
          ns=$(dig +short NS integraleconnect.com | sort | paste -sd ' ')
          cname=$(dig +short CNAME www.integraleconnect.com | paste -sd ' ')
          origin=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' 'https://gestionstagiaires-r5no.onrender.com/healthz' -H 'X-Forwarded-Host: www.integraleconnect.com' -H 'X-Forwarded-Proto: https')
          printf 'DNS autoritaire: %s\nCNAME www: %s\nSanté de la vraie origine Render avec hôte TLS canonique: %s\n' "$ns" "$cname" "$origin" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$origin" = 200
