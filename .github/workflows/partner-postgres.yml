name: PostgreSQL partenaires

on:
  pull_request:
    paths:
      - "partner_postgres.py"
      - "app.py"
      - "tests/test_partner*.py"
      - ".github/workflows/partner-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: partners_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d partners_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Créer un rôle de test soumis aux règles RLS
        env:
          PGPASSWORD: ephemeral-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d partners_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE partner_test LOGIN PASSWORD 'ephemeral-ci-only' NOSUPERUSER NOBYPASSRLS;
          GRANT CREATE ON DATABASE partners_test TO partner_test;
          SQL
      - name: Vérifier les requêtes réelles et l’isolation des partenaires
        env:
          TEST_PARTNER_POSTGRES_URL: postgresql://partner_test:ephemeral-ci-only@127.0.0.1:5432/partners_test
          PERSIST_DIR: ${{ runner.temp }}/partners-persist
        run: |
          python -m pytest -q tests/test_partner_postgres_integration.py tests/test_partner_postgres_hybrid.py tests/test_partner_security_hardening.py
