name: DESP Zoom repair checks
on:
  push:
    branches: [fix/desp-zoom-signed-download-20260925]
    paths: [.github/workflows/desp-zoom-repair.yml, scripts/repair_desp_zoom.py, tests/test_desp_zoom_download_regression.py]
permissions:
  contents: write
concurrency:
  group: desp-zoom-repair
  cancel-in-progress: false
jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERSIST_DIR: /tmp/desp-zoom-tests
      SECRET_KEY: isolated-regression-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Prove the partial-signature download regression
        run: |
          set +e
          python -m pytest -q tests/test_desp_zoom_download_regression.py::DespZoomDownloadRegressionTests::test_partial_signatures_download_original_current_pdf > /tmp/desp-before.txt 2>&1
          result=$?
          cat /tmp/desp-before.txt
          test "$result" -eq 1
      - name: Apply targeted source repair
        run: python scripts/repair_desp_zoom.py
      - name: Verify DESP attendance and download regressions
        run: |
          python -m py_compile app.py
          python -m pytest -q tests/test_desp_kickoff_attendance.py tests/test_desp_zoom_download_regression.py
      - name: Verify related Yousign and kickoff behavior
        run: |
          mapfile -t related < <(find tests -maxdepth 1 -type f \( -name '*yousign*' -o -name '*aps_kickoff*' \) | sort)
          if [ ${#related[@]} -gt 0 ]; then python -m pytest -q "${related[@]}"; fi
      - name: Commit only the tested application changes to the repair branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py templates/admin_trainees.html
          git diff --cached --stat
          git commit -m 'fix: download DESP Zoom attendance with collected Yousign signatures'
          git push origin HEAD:fix/desp-zoom-signed-download-20260925
