name: Maintenance anciens liens

on:
  pull_request:
    paths:
      - "crm_app.py"
      - "maintenance_recovery.py"
      - "static/sw.js"
      - "static/maintenance*"
      - "tests/test_maintenance_recovery.py"
      - "tests/maintenance-recovery.test.cjs"
      - ".github/workflows/maintenance-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            maintenance_recovery.py
            tests/conftest.py
            tests/test_maintenance_recovery.py
            tests/maintenance-recovery.test.cjs
            static/sw.js
            static/maintenance.html
            static/maintenance-register.js
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install Flask==3.0.0 pytest
      - run: python -m pytest -q tests/test_maintenance_recovery.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/maintenance-recovery.test.cjs
