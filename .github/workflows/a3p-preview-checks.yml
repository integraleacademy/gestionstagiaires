name: A3P — vérifier le parcours de préparation
on:
  push:
    branches: [codex/a3p-preparation-20261010, test-v2]
    paths:
      - elearning_native/a3p.py
      - elearning_native/a3p_resources/**
      - templates/_a3p*
      - static/css/a3p*
      - tests/test_native_elearning_a3p.py
      - scripts/check_a3p_ui.py
      - .github/workflows/a3p-preview-checks.yml
permissions:
  contents: read
concurrency:
  group: a3p-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PERSIST_DIR: /tmp/a3p-ci-synthetic-data
      SECRET_KEY: a3p-ci-synthetic-key-not-used-in-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Installer les dépendances de test
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest playwright
      - name: Vérifier les contenus, les accès et les régressions du lecteur
        run: python -m pytest tests/test_native_elearning_a3p.py tests/test_native_elearning_web.py tests/test_native_elearning_exams.py -q
      - name: Installer Chromium pour les contrôles visuels
        run: python -m playwright install --with-deps chromium
      - name: Vérifier le catalogue, le lecteur et le QCM sur bureau et mobile
        run: python scripts/check_a3p_ui.py
      - name: Conserver les captures de contrôle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a3p-preview-screenshots
          path: /tmp/a3p-ui/*.png
          if-no-files-found: warn
          retention-days: 7
