name: CNAPS active-only verification
on:
  push:
    branches: [fix/cnaps-active-notifications-20260928]
    paths:
      - .github/workflows/cnaps-active-notifications-check.yml
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/cnaps-active-notifications-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERSIST_DIR: /tmp/cnaps-test-persist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply the reviewed patch without overwriting unrelated edits
        run: |
          test "$(git hash-object app.py)" = ebd5ac49606e3ab39a6b2753a0a1ef2634743917
          git apply --check .cnaps-active-only.patch
          git apply .cnaps-active-only.patch
          test "$(git hash-object app.py)" = 7031115eec56983f8f6eac319f55f68fcc8120a4
          test "$(git hash-object tests/test_cnapsv3_sync.py)" = 4164e87a925902de8e391a25fca040f429e642aa
          python -m py_compile app.py crm_app.py tests/test_cnaps_active_only_notifications.py
          git diff --check
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: CNAPS and notification regressions with external network blocked
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_cnaps*.py tests/test_admin_cnaps*.py tests/test_afc_cnaps*.py tests/test_admin_notifications.py 2>&1 | tee /tmp/cnaps-tests.log
          node --test tests/test_cnaps_tracking_ui.cjs 2>&1 | tee /tmp/cnaps-ui-tests.log
          python - <<'PY'
          from crm_app import app
          response = app.test_client().get('/healthz')
          assert response.status_code == 200, response.status_code
          print('crm_app import and /healthz: OK')
          PY
      - name: Commit only the tested correction on the fix branch
        run: |
          test "$GITHUB_REF_NAME" = fix/cnaps-active-notifications-20260928
          git add app.py tests/test_cnapsv3_sync.py tests/test_cnaps_active_only_notifications.py
          git rm .cnaps-active-only.patch .github/workflows/cnaps-active-notifications-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Notifie uniquement les passages réels à Actif et masque les anciennes fausses alertes CNAPS'
          git push origin HEAD:refs/heads/fix/cnaps-active-notifications-20260928
          git rev-parse HEAD > /tmp/cnaps-tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cnaps-active-only-test-results
          path: |
            /tmp/cnaps-tests.log
            /tmp/cnaps-ui-tests.log
            /tmp/cnaps-tested-commit.txt
          retention-days: 7
