envVarGroups:
  - name: gestionstagiaires-cron-secrets
    envVars:
      # Render generates this value once and shares the exact same secret with
      # the web service and every cron caller.
      - key: CRON_SECRET
        generateValue: true
  - name: gestionstagiaires-cnaps-monitor-secrets
    envVars:
      # One shared value authenticates the worker against the web service.
      - key: CNAPS_MONITOR_TOKEN
        sync: false

services:
  - type: web
    name: gestionstagiaires
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - fromGroup: gestionstagiaires-cnaps-monitor-secrets
      - key: QONTO_LOGIN
        sync: false
      - key: QONTO_SECRET_KEY
        sync: false
      - key: QONTO_IBAN
        sync: false
      - key: QONTO_BENEFICIARY_NAME
        value: INTEGRALE ACADEMY
      - key: QONTO_API_BASE_URL
        value: https://thirdparty.qonto.com
      - key: QONTO_OAUTH_REDIRECT_URI
        value: https://gestionstagiaires-r5no.onrender.com/api/qonto/oauth/callback
      - key: QONTO_OAUTH_CLIENT_ID
        sync: false
      - key: QONTO_OAUTH_CLIENT_SECRET
        sync: false
      - key: QONTO_OAUTH_ENV
        value: production
      - key: QONTO_WEBHOOK_SECRET
        sync: false
      - key: QONTO_WEBHOOK_CALLBACK_URL
        value: https://gestionstagiaires-r5no.onrender.com/api/webhooks/qonto
      - key: PUBLIC_STUDENT_PORTAL_BASE
        value: https://gestionstagiaires-r5no.onrender.com
      - key: HEBERGEMENT_STATUS_ENDPOINT
        value: https://assistance-alw9.onrender.com/lookup_hebergement.json
      - key: CNAPSV3_API_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Espace BTS autonome : la clé identifie le CFA, tandis que le couple
      # OAuth identifie spécifiquement Gestion Stagiaires auprès d'AKTO.
      - key: AKTO_API_BASE_URL
        sync: false
      - key: AKTO_OAUTH_TOKEN_URL
        sync: false
      - key: AKTO_OAUTH_CLIENT_ID
        sync: false
      - key: AKTO_OAUTH_CLIENT_SECRET
        sync: false
      - key: AKTO_API_KEY
        sync: false
      - key: AKTO_OAUTH_SCOPE
        value: .default
      - key: AKTO_API_EDITOR
        value: Intégrale Academy
      - key: AKTO_API_SOFTWARE
        value: Gestion Stagiaires - Espace BTS
      - key: AKTO_API_VERSION
        value: "1.0"
      - key: WEDOF_WEBHOOK_SECRET
        sync: false
      - key: WEDOF_API_KEY
        sync: false
      - key: AFC_IMPORT_VISION_MODEL
        value: gpt-4.1-mini
      # Automatisation réelle active par défaut. Ce seul arrêt d'urgence peut
      # suspendre les déclarations sans dépendre d'anciens drapeaux Render.
      - key: WEDOF_AUTOMATION_KILL_SWITCH
        value: "false"
      # Les scans de secours sont séparés des actions dues, plafonnés par le
      # gouverneur central et limités à quatre passages par jour.
      - key: WEDOF_RECONCILIATION_ENABLED
        value: "true"
      - key: WEDOF_PAGE_LIMIT
        value: "100"
      - key: WEDOF_GOVERNOR_ENABLED
        value: "true"
      - key: WEDOF_REQUEST_LIMIT_PER_HOUR
        value: "100"
      - key: WEDOF_REQUEST_LIMIT_PER_DAY
        value: "500"
      - key: WEDOF_REQUEST_LIMIT_PER_MONTH
        value: "15000"
      # Une action réussie utilise normalement un GET de contrôle, un POST et
      # un GET de confirmation. Trente dossiers gardent une marge sous 100 appels/h.
      - key: WEDOF_LIVE_MAX_CANDIDATES_PER_RUN
        value: "30"
      - key: WEDOF_LIVE_RETRY_MINUTES
        value: "10"
      - key: WEDOF_MAINTENANCE_WINDOW_ENABLED
        value: "true"
      - key: WEDOF_MAINTENANCE_START_TIME
        value: "05:00"
      - key: WEDOF_MAINTENANCE_END_TIME
        value: "07:00"
  - type: cron
    name: gestionstagiaires-wedof-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Le moteur ne contacte WEDOF que lorsqu'une action est réellement due.
    # Ces passages rapprochés permettent de reprendre une panne transitoire
    # dix minutes plus tard sans augmenter les synchronisations globales.
    schedule: "5,15,25,35,45,55 * * * *"
    dockerCommand: python scripts/run_wedof_automation.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: WEDOF_AUTOMATION_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/wedof-automation
  - type: cron
    name: gestionstagiaires-wedof-reconciliation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Quatre passages espacés sur la journée : 08:17, 12:17, 16:17 et 20:17
    # en heure d'été de Paris (une heure plus tôt en heure d'hiver).
    schedule: "17 6,10,14,18 * * *"
    dockerCommand: python scripts/run_wedof_reconciliation.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: WEDOF_RECONCILIATION_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/wedof-reconciliation
  - type: cron
    name: gestionstagiaires-convocation-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Hourly execution lets due reminders go out promptly; the app enforces
    # the 08:00-20:00 Europe/Paris window (including daylight-saving time).
    schedule: "0 * * * *"
    dockerCommand: python scripts/run_convocation_reminders.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: CONVOCATION_REMINDERS_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/convocation-signature-reminders
  - type: cron
    name: gestionstagiaires-a3p-hosting-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "15 6 * * *"
    dockerCommand: python scripts/run_a3p_hosting_reminders.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: A3P_HOSTING_REMINDERS_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/a3p-hosting-reminders
  - type: cron
    name: gestionstagiaires-cash-payment-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 6 * * *"
    dockerCommand: python scripts/run_cash_payment_reminders.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: CASH_PAYMENT_REMINDERS_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/cash-payment-reminders
  - type: cron
    name: gestionstagiaires-afc-documents-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Hourly execution prevents a reminder that becomes due after the morning
    # pass from waiting until the following day. The app limits delivery to
    # 08:00-20:00 Europe/Paris and keeps the two-/three-day intervals.
    schedule: "0 * * * *"
    dockerCommand: python scripts/run_afc_documents_reminders.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: AFC_DOCUMENTS_REMINDERS_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/afc-documents-reminders
  - type: cron
    name: gestionstagiaires-daily-recap
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The endpoint sends after 08:00 Europe/Paris on weekdays only. Running
    # hourly keeps the delivery correct across winter/summer time changes.
    schedule: "0 * * * *"
    dockerCommand: python scripts/run_daily_recap.py
    envVars:
      - fromGroup: gestionstagiaires-cron-secrets
      - key: DAILY_RECAP_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/cron/daily-recap
  - type: worker
    name: gestionstagiaires-cnaps-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/run_cnaps_monitor_worker.py
    envVars:
      - fromGroup: gestionstagiaires-cnaps-monitor-secrets
      - key: CNAPS_MONITOR_URL
        value: https://gestionstagiaires-r5no.onrender.com/internal/jobs/cnaps-public-annuaire-monitor
      - key: CNAPS_MONITOR_INTERVAL_SECONDS
        value: 900
