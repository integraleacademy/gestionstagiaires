<section class="afc-picker" data-afc-picker data-url="{{ url_for('api_afc_session_candidates', session_id=session.id) }}">
  <input type="hidden" id="afcSelectedCandidateId">
  <div class="afc-picker-heading"><div><strong>Un candidat déjà dans votre liste AFC ?</strong><p>Retrouvez sa fiche et reprenez ses coordonnées.</p></div><button type="button" class="btn btn-outline" data-afc-open>Importer depuis AFC</button></div>
  <div data-afc-search-panel hidden>
    <label for="afcCandidateSearch" class="label">Rechercher par nom, prénom, e-mail ou identifiant France Travail</label>
    <input id="afcCandidateSearch" type="search" autocomplete="off" placeholder="Rechercher un candidat AFC…">
    <div data-afc-results class="afc-picker-results"></div>
  </div>
  <p data-afc-feedback role="status" aria-live="polite"></p>
  <button type="button" data-afc-clear class="btn btn-outline" hidden>Annuler la sélection AFC</button>
</section>
<style>

</style>
