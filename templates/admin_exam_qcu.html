<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU d'entraînement DESP</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090f20;color:#fff}.screen{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:28px clamp(20px,6vw,90px);background:radial-gradient(circle at top right,#312e81,#090f20 55%)}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.progress,.hint{color:#c7d2fe}.timer{width:88px;height:88px;border:6px solid #818cf8;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900}.content{align-self:center;max-width:980px;width:100%;margin:auto}.content h1{font-size:clamp(28px,4vw,52px);line-height:1.12;margin:24px 0 34px}.choices{display:grid;gap:14px}.choice{width:100%;text-align:left;background:#fff;color:#111827;border:3px solid transparent;border-radius:16px;padding:20px;font-size:18px;font-weight:700;cursor:pointer}.choice:hover,.choice.selected{border-color:#818cf8;background:#eef2ff}.bar{height:8px;background:#27334e;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#818cf8}.hint{text-align:center;margin-top:16px}.error{color:#fecaca}</style></head><body>
<main class="screen"><header><div><div class="brand">INTÉGRALE ACADEMY · DESP · ENTRAÎNEMENT</div><div class="progress" id="progress"></div></div><div class="timer" id="timer">45</div></header><section class="content"><h1 id="question">Synchronisation avec le serveur…</h1><div class="choices" id="choices"></div><p class="hint" id="status">Chaque réponse est immédiatement horodatée et enregistrée. En cas de coupure réseau, le chronomètre continue : reconnectez-vous sans recharger la page.</p></section><footer><div class="bar"><i id="bar"></i></div></footer></main>
<script>
const baseUrl={{ url_for('admin_exam_training_qcu_play',session_id=exam.id,attempt_id=attempt.id)|tojson }},completeUrl={{ url_for('admin_exam_training_qcu_complete',session_id=exam.id,attempt_id=attempt.id)|tojson }},questionCount={{ question_count }},QUESTION_DURATION_MS={{ question_seconds }}*1000;
let current=0,deadlineServer=0,serverOffset=0,tickTimer=null,busy=false;
async function syncClock(){const sent=performance.now(),response=await fetch(`${baseUrl}/clock`,{cache:'no-store'}),received=performance.now();if(!response.ok)throw new Error('Synchronisation refusée');const data=await response.json();serverOffset=Date.parse(data.server_time)-((sent+received)/2)}
const serverNow=()=>performance.now()+serverOffset;
function updateClock(){const left=Math.max(0,deadlineServer-serverNow());document.getElementById('timer').textContent=Math.ceil(left/1000);document.getElementById('bar').style.width=`${left/QUESTION_DURATION_MS*100}%`;if(!left&&!busy){clearInterval(tickTimer);advance()}}
async function show(){if(current>=questionCount)return finish();busy=true;try{await syncClock();const response=await fetch(`${baseUrl}/questions/${current}/open`,{method:'POST'}),question=await response.json();if(!response.ok)throw new Error(question.error||'Ouverture refusée');deadlineServer=Date.parse(question.deadline_at);document.getElementById('progress').textContent=`Question ${current+1} sur ${questionCount}`;document.getElementById('question').textContent=question.question;document.getElementById('choices').innerHTML=question.choices.map((choice,index)=>`<button class="choice" data-answer="${index}">${String.fromCharCode(65+index)}. ${choice}</button>`).join('');document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>answer(Number(button.dataset.answer)));document.getElementById('status').className='hint';clearInterval(tickTimer);busy=false;updateClock();tickTimer=setInterval(updateClock,100)}catch(error){document.getElementById('status').className='hint error';document.getElementById('status').textContent=`${error.message}. Vérifiez la connexion puis réessayez sans recharger.`;busy=false;setTimeout(show,2000)}}
async function answer(selected){if(busy||serverNow()>deadlineServer)return advance();busy=true;document.querySelectorAll('.choice').forEach(button=>button.disabled=true);try{const response=await fetch(`${baseUrl}/questions/${current}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:selected})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Réponse refusée');document.querySelector(`[data-answer="${selected}"]`).classList.add('selected');busy=false;setTimeout(advance,450)}catch(error){document.getElementById('status').className='hint error';document.getElementById('status').textContent=error.message;busy=false}}
function advance(){if(busy)return;clearInterval(tickTimer);busy=true;current++;show()}
async function finish(){clearInterval(tickTimer);busy=true;document.getElementById('question').textContent='QCU terminé';document.getElementById('choices').innerHTML='<p>Enregistrement de votre entraînement…</p>';try{const response=await fetch(completeUrl,{method:'POST',headers:{'Accept':'application/json'}}),data=await response.json();if(!response.ok)throw new Error(data.error||'Clôture refusée');location.href=data.redirect}catch(error){document.getElementById('choices').innerHTML=`<button class="choice" id="retry">${error.message} — Réessayer</button>`;document.getElementById('retry').onclick=finish;busy=false}}
setInterval(()=>syncClock().catch(()=>{}),15000);window.addEventListener('beforeunload',event=>{event.preventDefault();event.returnValue=''});show();
</script></body></html>
