<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU d'entraînement DESP</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090f20;color:#fff}.screen{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:28px clamp(20px,6vw,90px);background:radial-gradient(circle at top right,#312e81,#090f20 55%)}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.progress{color:#c7d2fe}.timer{width:88px;height:88px;border:6px solid #818cf8;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900}.content{align-self:center;max-width:980px;width:100%;margin:auto}.content h1{font-size:clamp(28px,4vw,52px);line-height:1.12;margin:24px 0 34px}.choices{display:grid;gap:14px}.choice{width:100%;text-align:left;background:#fff;color:#111827;border:3px solid transparent;border-radius:16px;padding:20px;font-size:18px;font-weight:700;cursor:pointer}.choice:hover,.choice.selected{border-color:#818cf8;background:#eef2ff}.bar{height:8px;background:#27334e;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#818cf8;transition:width .2s}.hint{text-align:center;color:#a5b4fc;margin-top:16px}</style></head><body>
<main class="screen"><header><div><div class="brand">INTÉGRALE ACADEMY · DESP</div><div class="progress" id="progress"></div></div><div class="timer" id="timer">45</div></header><section class="content"><h1 id="question"></h1><div class="choices" id="choices"></div><p class="hint">Sélectionnez une seule réponse. La question suivante s'affichera automatiquement.</p></section><footer><div class="bar"><i id="bar"></i></div></footer></main>
<script>const questions={{ questions|tojson }},completeUrl={{ url_for('admin_exam_training_qcu_complete',session_id=exam.id,attempt_id=attempt.id)|tojson }},QUESTION_DURATION_MS=45000,stateKey={{ ('desp-training-qcu-' ~ attempt.id)|tojson }};let current=0,deadline=0,tick,transitioning=false;
try{const saved=JSON.parse(localStorage.getItem(stateKey));if(saved&&Number.isInteger(saved.current)&&saved.current>=0&&saved.current<questions.length&&Number.isFinite(saved.deadline)){current=saved.current;deadline=saved.deadline}}catch(e){localStorage.removeItem(stateKey)}
function saveState(){localStorage.setItem(stateKey,JSON.stringify({current,deadline}))}
function updateClock(){const left=Math.max(0,deadline-Date.now()),seconds=Math.ceil(left/1000);document.getElementById('timer').textContent=seconds;document.getElementById('bar').style.width=`${left/QUESTION_DURATION_MS*100}%`;if(left<=0&&!transitioning)next();}
function show(){if(current>=questions.length)return finish();transitioning=false;const q=questions[current];if(!deadline)deadline=Date.now()+QUESTION_DURATION_MS;saveState();document.getElementById('progress').textContent=`Question ${current+1} sur ${questions.length}`;document.getElementById('question').textContent=q.question;document.getElementById('choices').innerHTML=q.choices.map((c,i)=>`<button class="choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(transitioning)return;if(Date.now()>=deadline){next();return}document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');transitioning=true;clearInterval(tick);setTimeout(next,450)});clearInterval(tick);updateClock();tick=setInterval(updateClock,100);}
function next(){if(!deadline)return;clearInterval(tick);deadline=0;current++;saveState();show()}async function finish(){clearInterval(tick);deadline=0;localStorage.removeItem(stateKey);document.getElementById('question').textContent='QCU terminé';document.getElementById('choices').innerHTML='<p>Enregistrement de votre entraînement…</p>';try{const r=await fetch(completeUrl,{method:'POST',headers:{'Accept':'application/json'}}),data=await r.json();location.href=data.redirect}catch(e){document.getElementById('choices').innerHTML='<button class="choice" onclick="finish()">Réessayer l’enregistrement</button>'}}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&deadline)updateClock()});show();</script></body></html>
