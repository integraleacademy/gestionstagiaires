{# This partial is included globally at the end of base.html. Keep the
   responsive hardening here so every admin/public page receives it without
   duplicating imports across individual templates. #}
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css', v=static_version|default('20260823-responsive-platform')) }}">
<script src="{{ url_for('static', filename='responsive.js', v=static_version|default('20260823-responsive-platform')) }}"></script>

<div id="globalMailSentBadge" class="global-mail-sent-badge" role="status" aria-live="polite">Mail envoyé</div>
<style>
  .global-mail-sent-badge{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%) translateY(20px);
    background:#16a34a;
    color:#fff;
    padding:9px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    box-shadow:0 10px 24px rgba(15,23,42,.24);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:9999;
  }
  .global-mail-sent-badge.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
<script>
  (() => {
    const badge = document.getElementById('globalMailSentBadge');
    if (!badge) return;

    let hideTimer = null;
    const showMailSentBadge = () => {
      badge.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        badge.classList.remove('show');
      }, 2600);
    };

    window.showMailSentBadge = showMailSentBadge;

    if ({{ "true" if global_mail_sent_notice else "false" }}) {
      showMailSentBadge();
    }

    if (!window.__mailSentFetchHookInstalled && typeof window.fetch === 'function') {
      window.__mailSentFetchHookInstalled = true;
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (...args) => {
        const response = await originalFetch(...args);
        try {
          const contentType = (response.headers.get('content-type') || '').toLowerCase();
          if (contentType.includes('application/json')) {
            const payload = await response.clone().json();
            const shouldNotify = Boolean(
              payload?.mail_sent ||
              payload?.email_ok ||
              payload?.copy_email_ok ||
              payload?.email_sent ||
              payload?.emails_sent ||
              payload?.confirmation_email_sent
            );
            if (shouldNotify) showMailSentBadge();
          }
        } catch (_) {}
        return response;
      };
    }
  })();
</script>
