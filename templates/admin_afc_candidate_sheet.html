{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1 style="margin:0;">Fiche candidat AFC</h1>
    <a class="btn btn-outline" href="{{ url_for('admin_afc') }}">← Retour</a>
  </div>
</div>

<div class="card" style="margin-top:12px;">
  <div style="display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:8px;">
    <label>Identifiant France Travail <input id="identifiant_ft" value="{{ candidate.identifiant_ft or '' }}"></label>
    <label>Nom <input id="nom" value="{{ candidate.nom or '' }}"></label>
    <label>Prénom <input id="prenom" value="{{ candidate.prenom or '' }}"></label>
    <label>Mail <input id="email" value="{{ candidate.email or '' }}"></label>
    <label>Téléphone <input id="telephone" value="{{ candidate.telephone or '' }}"></label>
  </div>
</div>

<div class="card" style="margin-top:12px;">
  <h3>Décision candidat</h3>
  <label>Décision
    <select id="decision">
      <option value="">-- Choisir --</option>
      <option value="RETENU" {% if (candidate.decision or '')|upper == 'RETENU' %}selected{% endif %}>RETENU</option>
      <option value="NON RETENU" {% if (candidate.decision or '')|upper == 'NON RETENU' %}selected{% endif %}>NON RETENU</option>
    </select>
  </label>

  <div id="refusalBox" style="display:none;margin-top:8px;">
    <label>Motif de refus
      <select id="motif_refus">
        <option value="">-- Choisir --</option>
        {% for reason in refusal_reasons %}
        <option value="{{ reason }}" {% if candidate.motif_refus == reason %}selected{% endif %}>{{ reason }}</option>
        {% endfor %}
      </select>
    </label>

    <label style="display:block;margin-top:8px;">Complément refus
      <select id="complement_refus">
        <option value="">-- Choisir --</option>
        {% for complement in refusal_complements %}
        <option value="{{ complement }}" {% if candidate.complement_refus == complement %}selected{% endif %}>{{ complement }}</option>
        {% endfor %}
      </select>
    </label>

    <textarea id="complement_refus_autre" rows="3" style="width:100%;margin-top:8px;display:none;" placeholder="Précisez le complément refus">{{ candidate.complement_refus_autre or '' }}</textarea>
  </div>

  <button class="btn btn-primary" id="btnNotify" style="display:none;margin-top:10px;">NOTIFIER LE CANDIDAT</button>
  <button class="btn" id="btnSave" style="margin-top:10px;">Enregistrer</button>
</div>

<script>
const candidateId = "{{ candidate.id }}";
const decision = document.getElementById('decision');
const refusalBox = document.getElementById('refusalBox');
const btnNotify = document.getElementById('btnNotify');
const complement = document.getElementById('complement_refus');
const autre = document.getElementById('complement_refus_autre');

function refreshUI(){
  const nonRetenu = decision.value === 'NON RETENU';
  refusalBox.style.display = nonRetenu ? 'block' : 'none';
  btnNotify.style.display = (decision.value === 'RETENU' || decision.value === 'NON RETENU') ? 'inline-flex' : 'none';
  autre.style.display = complement.value === 'Autre' ? 'block' : 'none';
}
refreshUI();
decision.addEventListener('change', refreshUI);
complement.addEventListener('change', refreshUI);

async function saveCandidate(){
  const payload = {
    identifiant_ft: identifiant_ft.value, nom: nom.value, prenom: prenom.value,
    email: email.value, telephone: telephone.value, decision: decision.value,
    motif_refus: motif_refus.value, complement_refus: complement_refus.value,
    complement_refus_autre: complement_refus_autre.value,
  };
  const r = await fetch(`/api/admin/afc/candidates/${candidateId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok) alert('Erreur sauvegarde');
}
btnSave.onclick = saveCandidate;
btnNotify.onclick = async ()=>{
  await saveCandidate();
  const r = await fetch(`/api/admin/afc/candidates/${candidateId}/notify`,{method:'POST'});
  if(r.ok) alert('Notification envoyée'); else alert('Erreur envoi notification');
};
</script>
{% endblock %}
