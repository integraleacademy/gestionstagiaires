<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Plateforme • Intégrale Academy" }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">



</head>

<body class="{% if is_read_only %}read-only{% endif %}">
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('admin_sessions') }}">
<img
  src="{{ url_for('static', filename='logo-integrale.png') }}"
  alt="Intégrale Academy"
  style="height:80px;width:auto;display:block;"
/>
        <div>
          <strong>Intégrale Academy</strong>
          <span>Plateforme gestion stagiaires</span>
        </div>
      </a>
      {% if is_read_only %}
        <div style="margin-left:16px;padding:6px 10px;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:700;">
          Mode consultation (lecture seule)
        </div>
      {% endif %}
      <div style="display:flex;align-items:center;gap:10px;">
        {% if session.get("admin_logged_in") %}
          <a href="{{ url_for('admin_positioning_tests') }}"
             style="font-size:13px;color:#1f2937;text-decoration:none;padding:6px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
            Tests de positionnement
          </a>
          <a href="{{ url_for('admin_logout') }}"
             style="font-size:13px;color:#555;text-decoration:none;padding:6px 10px;border:1px solid #ddd;border-radius:8px;">
            Déconnexion
          </a>
        {% endif %}
      </div>
    </div>
  </div>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

<script>
  function openModal(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.add("show");
    el.style.display = "flex"; // optionnel, mais safe
    document.body.style.overflow = "hidden";
  }

  function closeModal(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.remove("show");
    el.style.display = "none"; // optionnel, mais safe
    document.body.style.overflow = "";
  }

  document.addEventListener("click", (e)=>{
    const closeBtn = e.target.closest?.("[data-close-modal]");
    if(closeBtn){
      closeModal(closeBtn.getAttribute("data-close-modal"));
      return;
    }

    const backdrop = e.target.closest?.(".modal-backdrop");
    if(backdrop && e.target === backdrop){
      closeModal(backdrop.id);
    }
  });
</script>
</body>
</html>
