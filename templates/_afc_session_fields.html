<label id="{{ prefix }}AfcChoiceField" style="grid-column:1/-1;display:none;">
  <span style="display:flex;align-items:center;gap:10px;font-weight:800;">
    <input id="{{ prefix }}AfcEnabled" type="checkbox" style="width:auto;">
    Parcours AFC · APS + SSIAP 1
  </span>
</label>
<div id="{{ prefix }}AfcCalendar" class="afc-calendar" style="grid-column:1/-1;display:none;">
  <div class="afc-calendar__intro"><strong>Calendrier des deux formations</strong><p>La période globale de la session reste le calendrier par défaut. Les dates de chaque stagiaire peuvent être personnalisées dans sa fiche.</p></div>
  <div class="afc-calendar__grid">
    <fieldset class="afc-calendar__course">
      <legend>APS</legend>
      <label>Début APS<input id="{{ prefix }}AfcApsStart" type="date"></label>
      <label>Fin APS<input id="{{ prefix }}AfcApsEnd" type="date"></label>
      <label>Examen APS<input id="{{ prefix }}AfcApsExam" type="date"></label>
    </fieldset>
    <fieldset class="afc-calendar__course afc-calendar__course--ssiap">
      <legend>SSIAP 1</legend>
      <label>Début SSIAP 1<input id="{{ prefix }}AfcSsiapStart" type="date"></label>
      <label>Fin SSIAP 1<input id="{{ prefix }}AfcSsiapEnd" type="date"></label>
      <label>Examen SSIAP 1<input id="{{ prefix }}AfcSsiapExam" type="date"></label>
    </fieldset>
  </div>
</div>
