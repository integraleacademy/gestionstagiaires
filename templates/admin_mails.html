{% extends "base.html" %}
{% block content %}
<style>
body.endpoint-admin-mails .main-content{max-width:1180px;padding:28px clamp(16px,3vw,40px) 48px!important}.mail-page{display:grid;gap:24px}.mail-header h1{margin:0 0 7px;color:#172033;font-size:32px}.mail-header p{margin:0;color:#64748b}.mail-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.mail-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.06)}.mail-card h2{margin:0 0 5px;color:#172033;font-size:18px}.mail-card p{margin:0;color:#64748b;font-size:13px}.mail-open{flex:none;border:0;border-radius:11px;padding:10px 15px;background:#2563eb;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.mail-open:hover{background:#1d4ed8}.mail-open:focus-visible,.mail-close:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.mail-dialog{width:min(900px,calc(100vw - 28px));height:min(850px,calc(100vh - 28px));padding:0;border:0;border-radius:20px;box-shadow:0 28px 80px rgba(15,23,42,.35)}.mail-dialog::backdrop{background:rgba(15,23,42,.65)}.mail-dialog-inner{height:100%;display:grid;grid-template-rows:auto 1fr;background:#e2e8f0}.mail-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;background:#fff;border-bottom:1px solid #e2e8f0}.mail-dialog-header h2{margin:0;color:#172033;font-size:19px}.mail-close{width:38px;height:38px;border:0;border-radius:50%;background:#f1f5f9;color:#334155;font-size:24px;line-height:1;cursor:pointer}.mail-preview{padding:16px;overflow:hidden}.mail-preview iframe{display:block;width:100%;height:100%;border:0;border-radius:12px;background:#fff}@media(max-width:600px){.mail-card{align-items:flex-start;flex-direction:column}.mail-open{width:100%}.mail-dialog{height:calc(100vh - 16px)}}
</style>
<div class="mail-page">
 <header class="mail-header"><h1>Modèles de mails</h1><p>Retrouvez ici les modèles de mails utilisés sur le site.</p></header>
 <section class="mail-list" aria-label="Liste des modèles de mails">
  <article class="mail-card"><div><h2>Mail hébergement A3P</h2><p>Proposition d’hébergement envoyée aux stagiaires A3P.</p></div><button class="mail-open" type="button" data-open-mail>Voir le modèle</button></article>
 </section>
</div>
<dialog class="mail-dialog" id="a3pHostingMail" aria-labelledby="a3pHostingMailTitle">
 <div class="mail-dialog-inner"><header class="mail-dialog-header"><h2 id="a3pHostingMailTitle">Mail hébergement A3P</h2><button class="mail-close" type="button" data-close-mail aria-label="Fermer">×</button></header><div class="mail-preview"><iframe title="Modèle du mail hébergement A3P" srcdoc="{{ preview_html|e }}"></iframe></div></div>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('a3pHostingMail');
  document.querySelector('[data-open-mail]')?.addEventListener('click', () => dialog.showModal());
  dialog.querySelector('[data-close-mail]')?.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
})();
</script>
{% endblock %}
