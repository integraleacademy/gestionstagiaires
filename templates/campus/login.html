{% extends "campus/base.html" %}{% block title %}Connexion{% endblock %}
{% block content %}<section class="card login"><h1>Mon espace de formation</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if not bearer %}<label>Nom de famille<input name="last_name" required autocomplete="family-name"></label>
<label>Date de naissance<input type="date" name="birth" required autocomplete="bday"></label>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<button>{{ "Accéder à ma formation" if bearer else "Se connecter" }}</button></form></section>{% endblock %}
