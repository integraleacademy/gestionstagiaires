{% macro icon(name) %}<svg class="pw-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if name == 'box' %}<path d="m12 3 9 5-9 5-9-5 9-5Z M3 8v9l9 5 9-5V8 M12 13v9 M7 5.8l9 5"/>{% elif name == 'invoice' %}<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z M9 7h6 M9 11h6 M9 15h4"/>{% elif name == 'learning' %}<path d="m2 8 10-5 10 5-10 5L2 8Z M6 10v7c4 3 8 3 12 0v-7 M22 8v9"/>{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3 M17 5a3 3 0 0 1 0 6 M18 14a5 5 0 0 1 3 5v2"/>{% elif name == 'back' %}<path d="m10 5-7 7 7 7 M3 12h18"/>{% elif name == 'close' %}<path d="m6 6 12 12 M6 18 18 6"/>{% else %}<path d="M5 12h14 m-6-6 6 6-6 6"/>{% endif %}</svg>{% endmacro %}
{% macro assist(partner, label, next, css='pw-button') %}<form class="pw-inline" method="post" action="{{ url_for('admin_partner_assist', partner_id=partner.id) }}"><input type="hidden" name="next" value="{{ next }}"><button type="submit" class="{{ css }}">{{ label }} {{ icon('arrow') }}</button></form>{% endmacro %}
{% macro empty(title, text, symbol='box') %}<div class="pw-empty">{{ icon(symbol) }}<h3>{{ title }}</h3><p>{{ text }}</p></div>{% endmacro %}
