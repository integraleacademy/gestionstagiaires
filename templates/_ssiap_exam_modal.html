<link rel="stylesheet" href="{{ url_for('static', filename='css/ssiap-exam.css', v='20261020-1') }}">
<dialog id="ssiapExamDialog" class="exam-dialog" aria-labelledby="ssiapExamTitle" data-url="{{ url_for('api_ssiap_exam', session_id=session.id) }}">
  <header class="exam-heading"><div><span class="exam-eyebrow">INTÉGRALE ACADEMY</span><h2 id="ssiapExamTitle">Examen SSIAP</h2><p>{{ session.name }}</p></div><button type="button" data-exam-close aria-label="Fermer la modale Examen" class="exam-close">×</button></header>
  <nav class="exam-tabs" aria-label="Rubriques de l’examen">
    <button type="button" data-exam-tab="candidates" aria-pressed="true">Dossiers candidats</button>
    <button type="button" data-exam-tab="organization" aria-pressed="false">Organisation et jury</button>
    <button type="button" data-exam-tab="attendance" aria-pressed="false">Feuille de présence</button>
  </nav>
  <div id="ssiapExamStatus" class="exam-status" role="status" aria-live="polite"></div>
  <div class="exam-content">
    <section data-exam-panel="candidates"><div id="ssiapExamCandidates">Chargement des dossiers…</div></section>
    <section data-exam-panel="organization" hidden><form id="ssiapExamConfig"></form><div id="ssiapExamMailHistory"></div></section>
    <section data-exam-panel="attendance" hidden><div id="ssiapExamAttendance"></div></section>
  </div>
</dialog>
{% include '_exam_jury_mail_dialog.html' %}
<script src="{{ url_for('static', filename='js/ssiap-exam.js', v='20261026-without-pv-1') }}" defer></script>
