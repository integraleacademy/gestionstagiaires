<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU {{ 'examen' if kind == 'exam' else 'entraînement' }}</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#111827;font-family:Inter,system-ui,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(820px,100%);background:#fff;border-radius:24px;box-shadow:0 24px 70px #312e8130;overflow:hidden}.head{padding:20px 28px;background:linear-gradient(135deg,#111827,#4338ca);color:#fff;display:flex;justify-content:space-between;gap:15px}.body{padding:32px}.meta{color:#6366f1;font-weight:800}.timer{font-size:25px;font-weight:900}.choices{display:grid;gap:12px;margin-top:25px}.choice{padding:17px;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:14px;font-size:16px;cursor:pointer}.choice:hover{border-color:#6366f1;background:#eef2ff}.choice:disabled{opacity:.6}h1{font-size:clamp(22px,4vw,32px)}.notice{color:#64748b}.done{text-align:center;padding:30px}.done strong{font-size:54px;color:#4338ca}@media(max-width:600px){.body{padding:22px}.head{padding:18px}}</style></head>
<body><main class="shell"><section class="card"><header class="head"><div><b>INTÉGRALE ACADEMY</b><div>{{ trainee.first_name }} {{ trainee.last_name }} · {{ 'Examen' if kind == 'exam' else 'Entraînement' }}</div></div><div class="timer" id="timer">{{ question_seconds }} s</div></header><div class="body"><div class="meta" id="progress">Préparation…</div><h1 id="question"></h1><div class="choices" id="choices"></div><p class="notice" id="notice">Une seule réponse est possible. Votre réponse est enregistrée immédiatement.</p></div></section></main>
<script>const base={{ url_for('public_trainee_qcu',token=token,kind=kind,attempt_id=attempt.id)|tojson }},total={{ question_count }},already={{ candidate.answers|length }};let position=already,tick,busy=false,deadline=0,serverOffset=0;
async function show(){if(position>=total)return done();document.getElementById('progress').textContent=`Question ${position+1} sur ${total}`;const sent=Date.now(),r=await fetch(`${base}/question/${position}`,{cache:'no-store'}),received=Date.now(),q=await r.json();if(!r.ok){document.getElementById('notice').textContent=q.error;return}serverOffset=Date.parse(q.server_time)-((sent+received)/2);deadline=Date.parse(q.deadline_at);document.getElementById('question').textContent=q.question;document.getElementById('choices').innerHTML=q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));clock()}
function clock(){clearInterval(tick);const update=()=>{const left=Math.max(0,deadline-(Date.now()+serverOffset));document.getElementById('timer').textContent=`${Math.ceil(left/1000)} s`;if(left<=0){clearInterval(tick);document.getElementById('notice').textContent='Temps écoulé : choisissez une réponse pour continuer.'}};update();tick=setInterval(update,250)}
async function answer(selected){if(busy)return;busy=true;clearInterval(tick);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const r=await fetch(`${base}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({position,answer:selected})}),j=await r.json();if(!r.ok){document.getElementById('notice').textContent=j.error;busy=false;return}position++;busy=false;show()}
function done(){clearInterval(tick);document.getElementById('timer').textContent='✓';document.querySelector('.body').innerHTML=`<div class="done"><strong>Merci !</strong><h1>Votre QCU est terminé.</h1><p>Vos réponses nominatives ont bien été enregistrées. Les résultats sont disponibles auprès de votre centre de formation.</p><a href="{{ url_for('public_trainee_space',token=token) }}">Retour à mon espace</a></div>`}show();</script></body></html>
