<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCU officiel DESP</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090f20;color:#fff}.screen{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:28px clamp(20px,6vw,90px);background:radial-gradient(circle at top right,#312e81,#090f20 55%)}header{display:flex;justify-content:space-between}.timer{font-size:30px;font-weight:900}.content{align-self:center;max-width:980px;width:100%;margin:auto}.choices{display:grid;gap:14px}.choice{padding:20px;border-radius:16px;font-size:18px;font-weight:700;text-align:left}.notice{color:#c7d2fe}.error{color:#fecaca}</style></head><body>
<main class="screen"><header><strong>INTÉGRALE ACADEMY · EXAMEN DESP</strong><div class="timer" id="timer">—</div></header><section class="content"><p id="progress"></p><h1 id="question">Synchronisation avec le serveur…</h1><div class="choices" id="choices"></div><p class="notice" id="status">En cas de coupure réseau, le chronomètre continue : reconnectez-vous sans recharger la page. Une réponse reçue après l’échéance serveur est refusée, sans délai de grâce.</p></section></main>
<script>
const baseUrl={{ url_for('admin_exam_official_qcu_play',session_id=exam.id,attempt_id=attempt.id)|tojson }},questionCount={{ question_count }},duration={{ question_seconds }}*1000;
let index=0,deadlineServer=0,serverOffset=0,timer=null,busy=false;
async function syncClock(){const sent=performance.now(),r=await fetch(`${baseUrl}/clock`,{cache:'no-store'}),received=performance.now(),j=await r.json();serverOffset=Date.parse(j.server_time)-((sent+received)/2);}
const serverNow=()=>performance.now()+serverOffset;
function tick(){const left=Math.max(0,deadlineServer-serverNow());document.getElementById('timer').textContent=Math.ceil(left/1000);if(!left)clearInterval(timer)}
async function openQuestion(){busy=true;try{await syncClock();const r=await fetch(`${baseUrl}/questions/${index}/open`,{method:'POST'}),q=await r.json();if(!r.ok)throw new Error(q.error||'Ouverture refusée');deadlineServer=Date.parse(q.deadline_at);document.getElementById('progress').textContent=`Question ${index+1} sur ${questionCount}`;document.getElementById('question').textContent=q.question;document.getElementById('choices').innerHTML=q.choices.map((c,i)=>`<button class="choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${c}</button>`).join('');document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>answer(Number(button.dataset.answer)));clearInterval(timer);tick();timer=setInterval(tick,100);busy=false}catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent=`${e.message}. Vérifiez la connexion puis réessayez sans recharger.`;setTimeout(openQuestion,2000)}}
async function answer(selected){if(busy)return;busy=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);try{const r=await fetch(`${baseUrl}/questions/${index}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:selected})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Réponse refusée');if(j.completed){clearInterval(timer);document.getElementById('question').textContent='Examen terminé';document.getElementById('choices').innerHTML='';document.getElementById('status').textContent='Toutes vos réponses ont été horodatées et enregistrées.';return}index++;await openQuestion()}catch(e){document.getElementById('status').className='error';document.getElementById('status').textContent=e.message;busy=false}}
setInterval(()=>syncClock().catch(()=>{}),15000);window.addEventListener('beforeunload',event=>{event.preventDefault();event.returnValue=''});openQuestion();
</script></body></html>
