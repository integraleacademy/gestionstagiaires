<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activation compte</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body style="max-width:520px;margin:60px auto;font-family:Arial,sans-serif;padding:20px"><div class="card"><h1>Définir votre mot de passe</h1>{% if error %}<p style="color:#b91c1c;font-weight:700">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><label>Nouveau mot de passe<input type="password" name="password" required style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:10px;"></label><label>Confirmation<input type="password" name="confirm" required style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #d1d5db;border-radius:10px;"></label><p style="color:#6b7280">Minimum 10 caractères avec lettres et chiffres.</p><button class="btn btn-blue" type="submit">Activer mon compte</button></form></div></body></html>
